<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cronología UCM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0A0B12; color: #EDEBE3; font-family: Inter, sans-serif; padding-bottom: 60px; }
  button { font-family: inherit; touch-action: manipulation; }
  .display-font { font-family: Cinzel, serif; }
  .bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at 15% 0%, rgba(62,124,224,0.10), transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(224,138,52,0.08), transparent 40%); }
  header, main, footer { position: relative; z-index: 1; }
  header { padding: 32px 20px 24px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #6B6B7D; margin: 0 0 4px; }
  h1 { font-size: 32px; font-weight: 700; color: #F3E7C9; margin: 0 0 16px; }
  .gauge { display: flex; gap: 10px; margin-bottom: 16px; }
  .gem-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .gem { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid #2A2B38; }
  .gem-num { font-size: 10px; color: #5A5A6C; }
  .stat-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
  .rank { font-size: 14px; color: #9A9AAC; margin: 0; }
  .count { font-size: 24px; font-weight: 600; color: #F3E7C9; margin: 2px 0 0; }
  .count span { color: #5A5A6C; font-weight: 400; }
  .count .count-sub { font-size: 12px; }
  button.reset { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6B6B7D; border: 1px solid #23232E; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .progress-outer { width: 100%; height: 8px; border-radius: 999px; overflow: hidden; background: #181923; display: flex; }
  .phase-bar-outer { width: 100%; height: 4px; border-radius: 999px; overflow: hidden; background: #181923; margin-bottom: 12px; display: flex; }
  .bar-seg { height: 100%; transition: width .3s ease; }
  .upcoming-note { font-size: 12px; color: #5A5A6C; margin: 8px 0 0; min-height: 1px; }
  .controls-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .control-group { display: flex; gap: 10px; }
  .control-sep { width: 1px; height: 12px; background: #262735; }
  .mini-toggle { font-size: 11px; padding: 0; cursor: pointer; border: none; background: none; color: #5A5A6C; }
  .mini-toggle.active { color: #C9A85C; font-weight: 600; }
  main { padding: 0 20px; }
  section.saga { margin-bottom: 40px; }
  .saga-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .saga-head h2 { font-size: 18px; font-weight: 600; color: #D8CBA8; margin: 0; }
  .saga-complete { font-size: 12px; color: #D8B23A; }
  .phase-block { margin-bottom: 32px; }
  .phase-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .phase-head h3 { font-size: 14px; font-weight: 500; color: #C9C9D6; margin: 0; }
  .phase-count { font-size: 12px; color: #5A5A6C; margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  .card { text-align: left; background: none; border: none; padding: 0; cursor: pointer; transition: transform .16s ease; }
  .card:active { transform: scale(0.97); }
  .poster-box { position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; margin-bottom: 6px; background: #15161F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; text-align: center; }
  .poster-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .placeholder-title { font-size: 9px; line-height: 1.2; color: rgba(237,235,227,0.75); position: relative; z-index: 1; }
  .type-badge { position: absolute; top: 4px; left: 4px; display: flex; align-items: center; gap: 3px; border-radius: 999px; padding: 2px 6px; background: rgba(10,11,18,0.8); z-index: 2; }
  .type-badge span { font-size: 8px; font-weight: 500; }
  .info-btn { position: absolute; top: 4px; right: 4px; border-radius: 999px; padding: 4px; background: rgba(10,11,18,0.75); z-index: 2; display: flex; }
  .stamp-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,11,18,0.35); z-index: 3; pointer-events: none; }
  .stamp-circle { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: rotate(-10deg); }
  .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(10,11,18,0.72); text-align: center; padding: 8px; z-index: 3; }
  .lock-date { font-size: 9px; color: #9A9AAC; }
  .card-title { font-size: 11px; line-height: 1.25; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 28px; }
  .card-year { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; color: #4A4A5A; margin: 2px 0 0; }
  footer { padding: 32px 20px 16px; }
  footer p { font-size: 10px; color: #3F3F4C; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -12px); opacity: 0; z-index: 60; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #15161F; transition: all .22s ease-out; pointer-events: none; max-width: 85vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #modalBackdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10,11,18,0.75); display: none; align-items: flex-end; justify-content: center; }
  #modalBackdrop.show { display: flex; }
  @media (min-width: 640px) { #modalBackdrop { align-items: center; } }
  #modalBox { width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; background: #13141D; border: 1px solid #23232E; }
  @media (min-width: 640px) { #modalBox { border-radius: 16px; } }
  #modalYear { font-size: 11px; color: #5A5A6C; margin: 0; }
  #modalTitle { font-size: 18px; font-weight: 600; color: #F3E7C9; margin: 0; }
  #modalClose { padding: 6px; border-radius: 999px; background: #1C1D28; border: none; cursor: pointer; display: flex; }
  #modalSynopsis { font-size: 14px; line-height: 1.6; color: #C9C9D6; margin: 12px 0 16px; }
  .modal-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #5A5A6C; margin: 0 0 8px; }
  #modalCharacters { display: flex; flex-wrap: wrap; gap: 8px; }
  .char-chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #1C1D28; color: #C9C9D6; border: 1px solid #262735; }
  #postCreditsSection { margin-top: 20px; padding-top: 16px; border-top: 1px solid #23232E; }
  #postCreditsBtn { font-size: 12px; padding: 8px 12px; border-radius: 999px; width: 100%; text-align: center; color: #9A9AAC; border: 1px solid #262735; background: #1C1D28; cursor: pointer; }
  #postCreditsText { font-size: 14px; line-height: 1.6; color: #C9C9D6; }
  #quizLaunchSection { margin-top: 12px; }
  #quizLaunchBtn { font-size: 13px; font-weight: 600; padding: 10px 12px; border-radius: 999px; width: 100%; text-align: center; color: #0A0B12; border: none; background: #F3E7C9; cursor: pointer; }
  #quizBackdrop { position: fixed; inset: 0; z-index: 55; background: rgba(10,11,18,0.8); display: none; align-items: flex-end; justify-content: center; }
  #quizBackdrop.show { display: flex; }
  @media (min-width: 640px) { #quizBackdrop { align-items: center; } }
  #quizBox { width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; background: #13141D; border: 1px solid #23232E; }
  @media (min-width: 640px) { #quizBox { border-radius: 16px; } }
  #quizHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #quizProgress { font-size: 12px; color: #9A9AAC; font-weight: 500; }
  #quizClose { padding: 6px; border-radius: 999px; background: #1C1D28; border: none; cursor: pointer; display: flex; }
  #quizBar { width: 100%; height: 4px; border-radius: 999px; overflow: hidden; background: #181923; margin-bottom: 18px; }
  #quizBarInner { height: 100%; border-radius: 999px; background: #F3E7C9; transition: width .25s ease; width: 0%; }
  .quiz-question { font-size: 15px; font-weight: 600; color: #EDEBE3; margin: 0 0 16px; line-height: 1.4; }
  .quiz-option { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; background: #1C1D28; border: 1px solid #262735; color: #C9C9D6; font-size: 13px; cursor: pointer; }
  .quiz-option.correct { border-color: #3FA65C; background: rgba(63,166,92,0.15); color: #8FE0A8; }
  .quiz-option.incorrect { border-color: #D14B4B; background: rgba(209,75,75,0.15); color: #F5928F; }
  .quiz-next { margin-top: 8px; width: 100%; padding: 10px; border-radius: 999px; border: none; background: #F3E7C9; color: #0A0B12; font-weight: 600; font-size: 13px; cursor: pointer; }
  .quiz-score { font-size: 32px; font-weight: 700; color: #F3E7C9; text-align: center; margin: 8px 0 4px; }
  .quiz-verdict { font-size: 14px; color: #C9C9D6; text-align: center; margin: 0 0 20px; }
  .quiz-actions { display: flex; gap: 8px; }
  .quiz-actions button { flex: 1; padding: 10px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  #quizRetryBtn { background: #F3E7C9; color: #0A0B12; }
  #quizCloseBtn { background: #1C1D28; color: #C9C9D6; border: 1px solid #262735 !important; }
  .skip-overlay, .summary-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,11,18,0.5); z-index: 3; pointer-events: none; }
  .skip-circle, .summary-circle { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .skip-circle { background: #4A4A5A; }
  .summary-circle { background: #38BDF8; }
  #statusBackdrop { position: fixed; inset: 0; z-index: 58; background: rgba(10,11,18,0.8); display: none; align-items: flex-end; justify-content: center; }
  #statusBackdrop.show { display: flex; }
  @media (min-width: 640px) { #statusBackdrop { align-items: center; } }
  #statusBox { width: 100%; max-width: 420px; border-radius: 16px 16px 0 0; padding: 16px; background: #13141D; border: 1px solid #23232E; }
  @media (min-width: 640px) { #statusBox { border-radius: 16px; } }
  #statusItemTitle { margin: 0 0 12px; }
  .status-option { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; background: #1C1D28; border: 1px solid #262735; color: #EDEBE3; font-size: 14px; cursor: pointer; }
  .status-option-clear { color: #6B6B7D; }
  .status-option-cancel { color: #6B6B7D; margin-bottom: 0; margin-top: 4px; background: none; border: none; text-align: center; }
  .star-rating { display: flex; gap: 3px; }
  .star-slot { position: relative; display: inline-block; }
  .star-fill-wrap { position: absolute; top: 0; left: 0; height: 100%; overflow: hidden; display: block; pointer-events: none; }
  .star-fill-wrap svg { display: block; }
  .star-click-left { position: absolute; top: 0; left: 0; width: 50%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .star-click-right { position: absolute; top: 0; right: 0; width: 50%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .card-rating-inline { color: #F3E7C9; }
  .poster-box img.blurred { filter: blur(11px); }
  .podium-list { display: flex; flex-direction: column; gap: 10px; }
  .podium-row { display: flex; align-items: center; gap: 12px; background: #12131B; border: 1px solid #20212C; border-radius: 10px; padding: 10px; }
  .podium-rank { font-size: 18px; width: 30px; text-align: center; flex-shrink: 0; }
  .podium-thumb { width: 44px; height: 66px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #1C1D28; }
  .podium-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .podium-info { flex: 1; min-width: 0; }
  .podium-title { font-size: 13px; color: #EDEBE3; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podium-year { font-size: 10px; color: #5A5A6C; margin: 0 0 4px; }
  .podium-edit-row { display: flex; align-items: center; gap: 6px; }
  .podium-edit-btn { font-size: 10px; color: #6B6B7D; background: none; border: 1px solid #262735; border-radius: 999px; padding: 3px 9px; cursor: pointer; margin-left: 4px; }
  .podium-edit-done { color: #0A0B12; background: #F3E7C9; border-color: #F3E7C9; font-weight: 600; }
  .podium-adjust { width: 22px; height: 22px; border-radius: 999px; border: 1px solid #262735; background: #1C1D28; color: #C9C9D6; font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #confirmBackdrop { position: fixed; inset: 0; z-index: 59; background: rgba(10,11,18,0.8); display: none; align-items: center; justify-content: center; padding: 20px; }
  #confirmBackdrop.show { display: flex; }
  #confirmBox { width: 100%; max-width: 340px; border-radius: 16px; padding: 20px; background: #13141D; border: 1px solid #23232E; }
  #confirmMessage { font-size: 14px; line-height: 1.5; color: #EDEBE3; margin: 0 0 16px; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions button { flex: 1; padding: 10px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  #confirmYesBtn { background: #D14B4B; color: #F5EDED; }
  #confirmNoBtn { background: #1C1D28; color: #C9C9D6; border: 1px solid #262735 !important; }
  .status-option.current { border-color: #F3E7C9; }
  .phase-chevron { transition: transform .15s ease; flex-shrink: 0; }
  .phase-chevron.collapsed { transform: rotate(-90deg); }
  .phase-grid-wrap { overflow: hidden; transition: max-height .32s ease; }
</style>
</head>
<body>
<div class="bg-decor"></div>
<div id="toast"></div>

<header>
  <p class="eyebrow">Cronología completa</p>
  <h1 class="display-font">Universo Marvel</h1>
  <div class="controls-row" id="viewToggle" style="margin-top:0; margin-bottom:14px; justify-content:space-between;">
    <div class="control-group">
      <button class="mini-toggle active" data-view="ucm">UCM</button>
      <button class="mini-toggle" data-view="other">Otros Universos</button>
      <button class="mini-toggle" data-view="podium">🏆 Podio</button>
    </div>
    <button id="blurEyeBtn" style="background:none; border:none; padding:2px; cursor:pointer; color:#6B6B7D; display:flex;"></button>
  </div>
  <div class="gauge" id="gauge"></div>
  <div class="stat-row">
    <div>
      <p class="count" id="count"></p>
    </div>
    <button class="reset" id="resetBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Reiniciar
    </button>
  </div>
  <div class="progress-outer" id="overallBar"></div>
  <p class="upcoming-note" id="upcomingNote"></p>
  <div class="controls-row" id="ucmControls">
    <div class="control-group" id="filters">
      <button class="mini-toggle active" data-filter="all">Todo</button>
      <button class="mini-toggle" data-filter="movie">Películas</button>
      <button class="mini-toggle" data-filter="series">Series</button>
    </div>
    <div class="control-sep"></div>
    <div class="control-group" id="sortToggle">
      <button class="mini-toggle active" data-sort="release">Por estreno</button>
      <button class="mini-toggle" data-sort="chrono">Cronológico</button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer></footer>

<div id="modalBackdrop">
  <div id="modalBox">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:8px;">
      <div>
        <p id="modalYear"></p>
        <h3 id="modalTitle" class="display-font"></h3>
      </div>
      <button id="modalClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9AAC" stroke-width="1.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p id="modalSynopsis"></p>
    <p class="modal-label">Personajes principales</p>
    <div id="modalCharacters"></div>
    <div id="postCreditsSection" style="display:none;">
      <button id="postCreditsBtn">Mostrar escena post-créditos</button>
      <p id="postCreditsText" style="display:none;"></p>
    </div>
    <div id="quizLaunchSection" style="display:none;">
      <button id="quizLaunchBtn">Hacer el quiz (10 preguntas)</button>
    </div>
  </div>
</div>

<div id="quizBackdrop">
  <div id="quizBox">
    <div id="quizHeader">
      <span id="quizProgress"></span>
      <button id="quizClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9AAC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="quizBar"><div id="quizBarInner"></div></div>
    <div id="quizBody"></div>
  </div>
</div>

<div id="statusBackdrop">
  <div id="statusBox">
    <p id="statusItemTitle" class="modal-label"></p>
    <div id="statusRatingSection" style="display:none; margin-bottom: 14px;">
      <p class="modal-label" style="margin-bottom:6px;">Tu calificación</p>
      <div id="statusRatingWidget"></div>
    </div>
    <button class="status-option" data-status="watched">Vista</button>
    <button class="status-option" data-status="summary">Solo vi el resumen</button>
    <button class="status-option" data-status="skip">No la quiero ver</button>
    <button class="status-option status-option-clear" data-status="">Sin marcar</button>
    <button class="status-option status-option-cancel" id="statusCancelBtn">Cancelar</button>
  </div>
</div>

<div id="confirmBackdrop">
  <div id="confirmBox">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button id="confirmYesBtn">Reiniciar</button>
      <button id="confirmNoBtn">Cancelar</button>
    </div>
  </div>
</div>


<script>
const PHASES = {
  1: { label: "Fase 1", color: "#3E7CE0", glow: "#8FB6FF" },
  2: { label: "Fase 2", color: "#D8B23A", glow: "#F5DE8C" },
  3: { label: "Fase 3", color: "#D14B4B", glow: "#F5928F" },
  4: { label: "Fase 4", color: "#8B5CE0", glow: "#C4A8FF" },
  5: { label: "Fase 5", color: "#3FA65C", glow: "#8FE0A8" },
  6: { label: "Fase 6", color: "#E08A34", glow: "#FFC98F" },
  7: { label: "Fase 7", color: "#D14B94", glow: "#F5A8D6" },
};
const SAGAS = [
  { id: "infinito", label: "Saga del Infinito", phases: [1, 2, 3] },
  { id: "multiverso", label: "Saga del Multiverso", phases: [4, 5, 6] },
  { id: "proxima", label: "Próxima Saga (sin nombre oficial)", phases: [7] },
];
const WATCHED_COLOR = "#10B981";
const WATCHED_GLOW = "#6EE7B7";
const SUMMARY_COLOR = "#38BDF8";
const TYPE_META = {
  movie: { label: "Película", color: "#C9A85C" },
  series: { label: "Serie", color: "#5B8DEF" },
  special: { label: "Especial", color: "#9B7EDE" },
};

const DATA = [
  { id: "iron-man", es: "Iron Man", en: "Iron Man", year: 2008, date: "2008-05-02", type: "movie", phase: 1,
    synopsis: "Tony Stark, magnate de armamento, resulta gravemente herido y secuestrado durante una demostración de armas; un electroimán conectado a un reactor Arc en su pecho es lo único que evita que la metralla llegue a su corazón. Con esa misma tecnología construye una armadura de alta tecnología para escapar — y decide usarla para proteger al mundo en vez de venderlo como arma.",
    characters: ["Tony Stark / Iron Man", "Pepper Potts", "James Rhodes", "Obadiah Stane"],
    postCredits: "Nick Fury aparece en la mansión de Tony para decirle que no es el único con habilidades especiales, y le habla por primera vez de la 'Iniciativa Vengadores'." },
  { id: "hulk", es: "El Increíble Hulk", en: "The Incredible Hulk", year: 2008, date: "2008-06-13", type: "movie", phase: 1,
    synopsis: "Bruce Banner, expuesto a una sobredosis de radiación gamma durante un experimento militar que buscaba recrear el suero del supersoldado, ahora se transforma en un gigante verde imparable cada vez que su ritmo cardíaco se dispara por ira o estrés extremo. Prófugo del ejército que quiere convertir su condición en arma, busca desesperadamente una cura.",
    characters: ["Bruce Banner / Hulk", "Betty Ross", "Thaddeus Ross", "Emil Blonsky"],
    postCredits: "Tony Stark visita al General Ross en un bar y le dice que está 'armando un equipo' — su primera referencia directa a los Vengadores." },
  { id: "iron-man-2", es: "Iron Man 2", en: "Iron Man 2", year: 2010, date: "2010-05-07", type: "movie", phase: 1,
    synopsis: "Con su identidad como Iron Man ya pública, Tony Stark descubre que el mismo reactor Arc que lo mantiene con vida lo está envenenando lentamente con paladio. Mientras busca una solución, un rival armamentista y un ingeniero ruso con sed de venganza ponen en jaque su legado.",
    characters: ["Tony Stark", "Natasha Romanoff", "James Rhodes", "Ivan Vanko"],
    postCredits: "El agente Coulson, enviado a Nuevo México, descubre un cráter en el desierto con un objeto enterrado — el martillo de Thor." },
  { id: "thor", es: "Thor", en: "Thor", year: 2011, date: "2011-05-06", type: "movie", phase: 1,
    synopsis: "Por su arrogancia y por desatar una guerra con Jotunheim, Odín destierra a Thor a la Tierra y le quita sus poderes, dejando su martillo Mjolnir bajo un hechizo que solo alguien digno puede levantar. Sin sus habilidades divinas, Thor debe aprender humildad entre los humanos para poder recuperarlas.",
    characters: ["Thor", "Loki", "Jane Foster", "Odín"],
    postCredits: "Nick Fury visita al Dr. Erik Selvig y le muestra el Teseracto, un cubo de energía de origen cósmico, para que lo estudie." },
  { id: "cap-1", es: "Capitán América: El Primer Vengador", en: "Captain America The First Avenger", year: 2011, date: "2011-07-22", type: "movie", phase: 1,
    synopsis: "Steve Rogers, un joven de salud frágil rechazado por el ejército, es aceptado en un programa experimental que lo transforma en supersoldado mediante un suero que lleva sus capacidades físicas al máximo humano posible. Ya transformado, enfrenta a HYDRA, la división de ciencia oscura del ejército nazi.",
    characters: ["Steve Rogers / Capitán América", "Bucky Barnes", "Peggy Carter", "Cráneo Rojo"],
    postCredits: "Steve despierta en pleno Times Square moderno y descubre que estuvo congelado casi 70 años; Nick Fury le confirma que hay un trabajo esperándolo." },
  { id: "avengers-1", es: "Los Vengadores", en: "The Avengers", year: 2012, date: "2012-05-04", type: "movie", phase: 1,
    synopsis: "Loki, hermano adoptivo de Thor, llega a la Tierra con un ejército alienígena y un cetro capaz de controlar mentes, obligando a Nick Fury a reunir por primera vez a los héroes más poderosos del planeta para detenerlo.",
    characters: ["Iron Man", "Capitán América", "Thor", "Hulk", "Viuda Negra", "Ojo de Halcón", "Loki"],
    postCredits: "Un ser alienígena le advierte a alguien fuera de cámara que desafiar a la Tierra 'es cortejar a la muerte' — quien escucha, sonríe. Es la primera aparición de Thanos. Al final, los Vengadores comen shawarma en silencio entre los escombros." },
  { id: "iron-man-3", es: "Iron Man 3", en: "Iron Man 3", year: 2013, date: "2013-05-03", type: "movie", phase: 2,
    synopsis: "Tras casi morir en la batalla de Nueva York, Tony Stark sufre ataques de pánico mientras un terrorista llamado el Mandarín pone en jaque al país.",
    characters: ["Tony Stark", "James Rhodes", "Pepper Potts", "Mandarín / Aldrich Killian"],
    postCredits: "Se revela que Tony le estuvo contando toda la película a Bruce Banner, quien se queda dormido — un chiste sobre la terapia entre 'amigos científicos'." },
  { id: "thor-2", es: "Thor: Un Mundo Oscuro", en: "Thor The Dark World", year: 2013, date: "2013-11-08", type: "movie", phase: 2,
    synopsis: "Una fuerza ancestral llamada el Éter resurge, poniendo a Thor y Jane Foster en el centro de un conflicto que amenaza todos los reinos.",
    characters: ["Thor", "Jane Foster", "Loki", "Malekith"],
    postCredits: "Sif y Volstagg le entregan el Éter a un misterioso Coleccionista, quien comenta que 'uno menos, quedan cinco' — la primera mención directa a las Gemas del Infinito." },
  { id: "cap-2", es: "Capitán América: El Soldado de Invierno", en: "Captain America The Winter Soldier", year: 2014, date: "2014-04-04", type: "movie", phase: 2,
    synopsis: "Steve Rogers descubre que S.H.I.E.L.D. está infiltrado y debe enfrentar a un misterioso asesino del pasado mientras huye como fugitivo.",
    characters: ["Steve Rogers", "Natasha Romanoff", "Bucky Barnes / Soldado del Invierno", "Sam Wilson / Falcon"],
    postCredits: "En una base secreta de HYDRA se revela al Barón von Strucker experimentando con el cetro de Loki sobre dos gemelos con habilidades — los futuros Quicksilver y Bruja Escarlata." },
  { id: "gotg-1", es: "Guardianes de la Galaxia", en: "Guardians of the Galaxy", year: 2014, date: "2014-08-01", type: "movie", phase: 2,
    synopsis: "Peter Quill roba un orbe misterioso que resulta contener una Gema del Infinito, lo que lo convierte en blanco de medio universo. Para protegerlo, se une a un grupo dispar de criminales espaciales.",
    characters: ["Peter Quill / Star-Lord", "Gamora", "Drax", "Rocket", "Groot"],
    postCredits: "En la sala de trofeos del Coleccionista aparece, entre curiosos objetos, un Howard el Pato viviente." },
  { id: "avengers-2", es: "Vengadores: La Era de Ultrón", en: "Avengers Age of Ultron", year: 2015, date: "2015-05-01", type: "movie", phase: 2,
    synopsis: "Tony Stark y Bruce Banner experimentan en secreto con la inteligencia artificial alojada en el cetro de Loki para crear un programa que proteja al planeta, pero el resultado, Ultrón, decide que la única forma de salvar la Tierra es exterminando a la humanidad.",
    characters: ["Iron Man", "Ultrón", "Bruja Escarlata", "Visión", "Thor", "Capitán América"],
    postCredits: "Thanos se pone él mismo el Guantelete del Infinito (todavía vacío) y dice, resignado: 'Bien, lo haré yo mismo'." },
  { id: "antman-1", es: "Ant-Man", en: "Ant-Man", year: 2015, date: "2015-07-17", type: "movie", phase: 2,
    synopsis: "El científico Hank Pym recluta al exladrón Scott Lang para usar el traje Ant-Man, una tecnología que le permite encogerse hasta escala subatómica mientras multiplica su fuerza, con el fin de impedir que su propia invención caiga en malas manos.",
    characters: ["Scott Lang / Ant-Man", "Hope van Dyne", "Hank Pym"],
    postCredits: "Falcon y el Capitán América confrontan a alguien que resulta ser Bucky Barnes; por separado, Hank Pym le muestra a Hope su propio traje de la Avispa." },
  { id: "civil-war", es: "Capitán América: Civil War", en: "Captain America Civil War", year: 2016, date: "2016-05-06", type: "movie", phase: 3,

  { id: "dr-strange-1", es: "Doctor Strange", en: "Doctor Strange", year: 2016, date: "2016-11-04", type: "movie", phase: 3,
    synopsis: "Tras un accidente automovilístico que destruye sus manos, el neurocirujano Stephen Strange viaja a Katmandú buscando una cura y termina aprendiendo artes místicas capaces de manipular el tiempo y abrir portales entre dimensiones.",

  { id: "gotg-2", es: "Guardianes de la Galaxia Vol. 2", en: "Guardians of the Galaxy Vol 2", year: 2017, date: "2017-05-05", type: "movie", phase: 3,

  { id: "spiderman-homecoming", es: "Spider-Man: Homecoming", en: "Spider-Man Homecoming", year: 2017, date: "2017-07-07", type: "movie", phase: 3,

  { id: "thor-3", es: "Thor: Ragnarok", en: "Thor Ragnarok", year: 2017, date: "2017-11-03", type: "movie", phase: 3,

  { id: "black-panther-1", es: "Black Panther", en: "Black Panther", year: 2018, date: "2018-02-16", type: "movie", phase: 3,

  { id: "infinity-war", es: "Vengadores: Infinity War", en: "Avengers Infinity War", year: 2018, date: "2018-04-27", type: "movie", phase: 3,

    postCredits: "Nick Fury alcanza a enviar un mensaje de auxilio justo antes de desintegrarse — el buscapersonas termina de transmitir mostrando un símbolo estelar." },
  { id: "antman-2", es: "Ant-Man y la Avispa", en: "Ant-Man and the Wasp", year: 2018, date: "2018-07-06", type: "movie", phase: 3,

  { id: "captain-marvel", es: "Capitana Marvel", en: "Captain Marvel", year: 2019, date: "2019-03-08", type: "movie", phase: 3,

  { id: "endgame", es: "Vengadores: Endgame", en: "Avengers Endgame", year: 2019, date: "2019-04-26", type: "movie", phase: 3,

  { id: "far-from-home", es: "Spider-Man: Far From Home", en: "Spider-Man Far From Home", year: 2019, date: "2019-07-02", type: "movie", phase: 3,

  { id: "wandavision", es: "WandaVision", en: "WandaVision", year: 2021, date: "2021-01-15", type: "series", phase: 4,

  { id: "falcon-ws", es: "Falcon y el Soldado de Invierno", en: "The Falcon and the Winter Soldier", year: 2021, date: "2021-03-19", type: "series", phase: 4,

  { id: "loki-1", es: "Loki (T1)", en: "Loki", year: 2021, date: "2021-06-09", type: "series", phase: 4,

  { id: "black-widow", es: "Black Widow", en: "Black Widow", year: 2021, date: "2021-07-09", type: "movie", phase: 4,

  { id: "whatif-1", es: "What If…? (T1)", en: "What If", year: 2021, date: "2021-08-11", type: "series", phase: 4,

  { id: "shang-chi", es: "Shang-Chi y la Leyenda de los Diez Anillos", en: "Shang-Chi and the Legend of the Ten Rings", year: 2021, date: "2021-09-03", type: "movie", phase: 4,

  { id: "eternals", es: "Eternals", en: "Eternals", year: 2021, date: "2021-11-05", type: "movie", phase: 4,

  { id: "hawkeye", es: "Hawkeye", en: "Hawkeye", year: 2021, date: "2021-11-24", type: "series", phase: 4,

  { id: "moon-knight", es: "Moon Knight", en: "Moon Knight", year: 2022, date: "2022-03-30", type: "series", phase: 4,

  { id: "dr-strange-2", es: "Doctor Strange en el Multiverso de la Locura", en: "Doctor Strange in the Multiverse of Madness", year: 2022, date: "2022-05-06", type: "movie", phase: 4,

  { id: "ms-marvel", es: "Ms. Marvel", en: "Ms Marvel", year: 2022, date: "2022-06-08", type: "series", phase: 4,

  { id: "thor-4", es: "Thor: Love and Thunder", en: "Thor Love and Thunder", year: 2022, date: "2022-07-08", type: "movie", phase: 4,

  { id: "i-am-groot", es: "Yo Soy Groot", en: "I Am Groot", year: 2022, date: "2022-08-10", type: "series", phase: 4,

function isReleased(item) { return new Date() >= new Date(item.date + "T00:00:00"); }
function buildBarSegments(done, summary, skip, total, mainColor) {
  if (!total) return "";
  const pct = function (n) { return (n / total) * 100; };
  return '<div class="bar-seg" style="width:' + pct(done) + "%;background:" + mainColor + '"></div>' +
    '<div class="bar-seg" style="width:' + pct(summary) + '%;background:' + SUMMARY_COLOR + '"></div>' +
    '<div class="bar-seg" style="width:' + pct(skip) + '%;background:#4A4A5A"></div>';
}
function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" });
}
function isResolved(status, id) { return status[id] === "watched" || status[id] === "skip" || status[id] === "summary"; }
function phaseStats(status, phase) {
  const items = DATA.filter((d) => d.phase === phase);
  const released = items.filter(isReleased);
  const done = released.filter((d) => status[d.id] === "watched");
  const skip = released.filter((d) => status[d.id] === "skip");
  const summary = released.filter((d) => status[d.id] === "summary");
  const resolved = released.filter((d) => isResolved(status, d.id));
  return {
    total: items.length, released: released.length, done: done.length,
    skip: skip.length, summary: summary.length, resolved: resolved.length,
    complete: released.length > 0 && resolved.length === released.length,
  };
}
function sagaComplete(status, saga) { return saga.phases.every((p) => phaseStats(status, p).complete); }
function matchesFilter(item, filter) {
  if (filter === "all") return true;
  if (filter === "movie") return item.type === "movie";
  if (filter === "series") return item.type === "series" || item.type === "special";
  return true;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

const TMDB_API_KEY = "0e5d79d586fade96033ce807a8ff9af8";
const TMDB_IMG_BASE = "https://image.tmdb.org/t/p/w342";

const POSTER_KEY = "mcu-posters-v8";
let posters = {};

// Ids puntuales a reintentar por una búsqueda mejorada, sin invalidar
// el resto del caché (evita pedir todo de nuevo de golpe y saturar la API).
const FORCE_REFETCH_IDS = [];

function loadPosterCache() {
  try { posters = JSON.parse(localStorage.getItem(POSTER_KEY) || "{}"); } catch (e) { posters = {}; }
  FORCE_REFETCH_IDS.forEach(function (id) { delete posters[id]; });
}
function savePosterCache() { try { localStorage.setItem(POSTER_KEY, JSON.stringify(posters)); } catch (e) {} }

async function fetchPosterWikipedia(item) {
  const hint = (item.type === "series" || item.type === "special") ? "TV series" : (item.year + " film");
  const q = encodeURIComponent(item.en + " " + hint);
  const url = "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + q +
    "&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=300&format=json&origin=*";
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const pages = data && data.query && data.query.pages;
    if (!pages) return null;
    const sorted = Object.values(pages).sort(function (a, b) { return (a.index || 0) - (b.index || 0); });
    for (const page of sorted) {
      if (page.thumbnail && page.thumbnail.source) return page.thumbnail.source;
    }
    return null;
  } catch (e) {
    return null;
  }
}

async function fetchTMDbPoster(item, kind, attempt) {
  attempt = attempt || 0;
  const yearParam = kind === "movie" ? ("&primary_release_year=" + item.year) : ("&first_air_date_year=" + item.year);
  const url = "https://api.themoviedb.org/3/search/" + kind + "?api_key=" + TMDB_API_KEY +
    "&query=" + encodeURIComponent(item.en) + yearParam;
  const res = await fetch(url);
  if (res.status === 429 && attempt < 2) {
    await new Promise(function (r) { setTimeout(r, 600 * (attempt + 1)); });
    return fetchTMDbPoster(item, kind, attempt + 1);
  }
  if (!res.ok) return null;
  const data = await res.json();
  const results = (data && data.results) || [];
  if (results.length === 0) return null;
  const norm = function (s) { return (s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); };
  const target = norm(item.en);
  const exact = results.find(function (r) {
    const title = kind === "movie" ? r.title : r.name;
    return norm(title) === target;
  });
  const best = exact || results[0];
  return best.poster_path ? TMDB_IMG_BASE + best.poster_path : null;
}

async function fetchPoster(item) {
  if (!TMDB_API_KEY || TMDB_API_KEY === "PEGA_TU_API_KEY_ACA") {
    return fetchPosterWikipedia(item);
  }
  const primaryKind = item.type === "series" ? "tv" : item.type === "special" ? "tv" : "movie";
  const secondaryKind = primaryKind === "movie" ? "tv" : "movie";
  try {
    const primary = await fetchTMDbPoster(item, primaryKind);
    if (primary) return primary;
    const secondary = await fetchTMDbPoster(item, secondaryKind);
    if (secondary) return secondary;
    return await fetchPosterWikipedia(item);
  } catch (e) {
    return await fetchPosterWikipedia(item);
  }
}

async function fetchAllPosters(items, onEach, concurrency = 4) {
  let cursor = 0;
  async function worker() {
    while (cursor < items.length) {
      const item = items[cursor++];
      const url = await fetchPoster(item);
      onEach(item.id, url);
    }
  }
  await Promise.all(new Array(Math.min(concurrency, items.length)).fill(0).map(worker));
}

function toggleUniverseCollapse(universeKey) {

  savePrefs();

  const wrap = document.querySelector('.phase-grid-wrap[data-universe="' + universeKey + '"]');
  const chevron = document.querySelector('.phase-head[data-universe="' + universeKey + '"] .phase-chevron');
  if (chevron) chevron.classList.toggle("collapsed", willCollapse);
  if (!wrap) return;

  if (willCollapse) {
    wrap.style.maxHeight = wrap.scrollHeight + "px";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { wrap.style.maxHeight = "0px"; });
    });
  } else {
    wrap.style.maxHeight = wrap.scrollHeight + "px";
    wrap.addEventListener("transitionend", function handler(e) {
      if (e.propertyName !== "max-height") return;
      wrap.style.maxHeight = "none";
      wrap.removeEventListener("transitionend", handler);
    });
  }
}

function showToast(message, color) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.border = "1px solid " + color;
  el.style.color = color;
  el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3200);
}

function setStatus(id, newStatus) {
  const prevPhaseComplete = {};
  const prevSagaComplete = {};
  Object.keys(PHASES).forEach(function (p) { prevPhaseComplete[p] = phaseStats(status, Number(p)).complete; });
  SAGAS.forEach(function (s) { prevSagaComplete[s.id] = sagaComplete(status, s); });

  const next = Object.assign({}, status);
  if (newStatus) next[id] = newStatus; else delete next[id];
  status = next;
  saveState();

  SAGAS.forEach(function (s) {
    if (!prevSagaComplete[s.id] && sagaComplete(status, s)) showToast("¡" + s.label + " completada!", "#D8B23A");
  });
  Object.keys(PHASES).forEach(function (p) {
    const num = Number(p);
    if (!prevPhaseComplete[p] && phaseStats(status, num).complete) {
      showToast(PHASES[num].label + " completa", PHASES[num].color);
    }
  });

  render();
}

const infoSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9C9D6" stroke-width="1.5"' + SVG_CAP +

function buildRatingRow(id, rating, size, editable) {
  editable = editable !== false;
  if (!editable) return buildStarRating(id, rating, size, false);
  return '<div class="podium-edit-row">' +
    '<button class="podium-adjust" onclick="event.stopPropagation(); adjustRating(\'' + id + '\', -0.5)">−</button>' +
    buildStarRating(id, rating, size, true) +
    '<button class="podium-adjust" onclick="event.stopPropagation(); adjustRating(\'' + id + '\', 0.5)">+</button>' +

const STAR_PATH = "M12 2l2.9 6.9 7.5.6-5.7 5 1.7 7.3-6.4-3.9-6.4 3.9 1.7-7.3-5.7-5 7.5-.6z";
function buildStarRating(id, rating, size, editable) {
  rating = rating || 0;
  size = size || 22;
  editable = editable !== false;
  let html = '<div class="star-rating" data-id="' + id + '">';
  for (let i = 1; i <= 5; i++) {
    const fillPct = Math.max(0, Math.min(1, rating - (i - 1))) * 100;
    html += '<span class="star-slot" style="width:' + size + 'px;height:' + size + 'px;">' +
      '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '"><path d="' + STAR_PATH + '" fill="none" stroke="#4A4A5A" stroke-width="1.5"/></svg>' +
      '<span class="star-fill-wrap" style="width:' + fillPct + '%">' +
      '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '"><path d="' + STAR_PATH + '" fill="#F3E7C9" stroke="#F3E7C9" stroke-width="1.5"/></svg>' +
      "</span>" +
      (editable
        ? '<span class="star-click-left" onclick="event.stopPropagation(); setRating(\'' + id + "', " + (i - 0.5) + ')"></span>' +
          '<span class="star-click-right" onclick="event.stopPropagation(); setRating(\'' + id + "', " + i + ')"></span>'
        : "") +
      "</span>";
  }
  html += '</div>';
  return html;
}

function buildCardHtml(item) {
  const rel = isReleased(item);
  const st = status[item.id];
  const isW = st === "watched";
  const typeMeta = item.type ? TYPE_META[item.type] : null;
  const poster = posters[item.id];

  const typeBadge = (rel && typeMeta)
    ? '<div class="type-badge" style="border:1px solid ' + typeMeta.color + '">' +
      typeIconSvg(item.type, typeMeta.color, 9) + '<span style="color:' + typeMeta.color + '">' + typeMeta.label + '</span></div>'
    : "";

  const shouldBlur = blurUnwatched && !st;
  const centerContent = rel
    ? (poster
        ? '<img src="' + poster + '" alt="" class="' + (shouldBlur ? "blurred" : "") + '" onerror="this.style.display=\'none\'; this.parentElement.dataset.broken=\'1\';" />'
        : typeIconSvg(item.type, "rgba(237,235,227,0.55)", 20) +
          '<span class="placeholder-title">' + escapeHtml(item.es) + "</span>")
    : "";

  const infoBtn = (st === "watched" || st === "summary") && item.synopsis
    ? '<div class="info-btn" onclick="event.stopPropagation(); openDetail(\'' + item.id + '\')">' + infoSvg + "</div>"
    : "";

    ? '<div class="stamp-overlay"><div class="stamp-circle" style="background:' + WATCHED_COLOR + ';box-shadow:0 0 10px ' + WATCHED_GLOW + '">' + checkSvg + "</div></div>"
    : "";

  const skipOverlay = rel && st === "skip"
    ? '<div class="skip-overlay"><div class="skip-circle">' + skipSvg + "</div></div>"
    : "";

  const summaryOverlay = rel && st === "summary"
    ? '<div class="summary-overlay"><div class="summary-circle">' + summarySvg + "</div></div>"
    : "";

  const lock = !rel
    ? '<div class="lock-overlay">' + lockSvg + '<span class="lock-date">' + formatDate(item.date) + "</span></div>"
    : "";

  const borderColor = st === "watched" ? WATCHED_COLOR : st === "skip" ? "#3A3A48" : st === "summary" ? SUMMARY_COLOR : "#20212C";
  const titleColor = !rel ? "#5A5A6C" : st === "skip" ? "#5A5A6C" : "#C9C9D6";

  const ratingBadge = ratings[item.id] ? '<span class="card-rating-inline">★ ' + ratings[item.id] + "</span>" : "";

  return '<button class="card" onclick="' + (rel ? "openStatusPicker('" + item.id + "')" : "") + '" style="cursor:' + (rel ? "pointer" : "default") + '">' +

    : "";

    const items = OTHER_DATA.filter(function (d) { return d.universe === universeKey; });
    const rel = items.filter(isReleased);
    const doneItems = rel.filter(function (d) { return status[d.id] === "watched"; });

    const summaryItems = rel.filter(function (d) { return status[d.id] === "summary"; });

  }

      '<div class="phase-head" data-universe="' + universeKey + '" onclick="toggleUniverseCollapse(\'' + universeKey + '\')" style="cursor:pointer;">' +

      '<div class="grid">' + cardsHtml + "</div></div>" +
      "</div>";
  }).join("");

function render() {
  if (mainView === "other") {
    document.getElementById("gauge").style.display = "none";
    document.getElementById("ucmControls").style.display = "none";
    renderOtherView();
    return;
  }
  if (mainView === "podium") {
    document.getElementById("gauge").style.display = "none";
    document.getElementById("ucmControls").style.display = "none";
    renderPodiumView();
    return;
  }
  document.getElementById("gauge").style.display = "";
  document.getElementById("ucmControls").style.display = "";

  const filtered = DATA.filter(function (d) { return matchesFilter(d, filter); });
  const released = filtered.filter(isReleased);
  const done = released.filter(function (d) { return status[d.id] === "watched"; });
  const skipTotal = released.filter(function (d) { return status[d.id] === "skip"; });
  const summaryTotal = released.filter(function (d) { return status[d.id] === "summary"; });

  document.getElementById("count").innerHTML = done.length + '<span> / ' + released.length + " vistas</span>";
  document.getElementById("overallBar").innerHTML = buildBarSegments(done.length, summaryTotal.length, skipTotal.length, released.length, WATCHED_COLOR);
  const upcoming = filtered.length - released.length;
  document.getElementById("upcomingNote").textContent = upcoming > 0
    ? upcoming + (upcoming > 1 ? " títulos todavía sin estrenar" : " título todavía sin estrenar")
    : "";

  function gemSvg(color) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.5"' + SVG_CAP +
      '<path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>';
  }

  const gauge = document.getElementById("gauge");
  gauge.innerHTML = Object.keys(PHASES).map(function (p) {
    const num = Number(p);
    const meta = PHASES[num];
    const stats = phaseStats(status, num);
    const gpct = stats.released ? stats.done / stats.released : 0;
    const bg = "radial-gradient(circle, " + meta.color + (stats.complete ? "" : "55") + " 0%, #15161F 72%)";
    const glow = stats.complete ? "0 0 12px " + meta.glow : "none";
    const border = gpct > 0 ? meta.color : "#2A2B38";
    const iconColor = gpct > 0 ? meta.glow : "#4A4A5A";
    return '<div class="gem-wrap" title="' + meta.label + '">' +
      '<div class="gem" style="background:' + bg + ';box-shadow:' + glow + ';border-color:' + border + '">' +
      gemSvg(iconColor) +
      '</div><span class="gem-num">' + num + '</span></div>';
  }).join("");

  const main = document.getElementById("main");

  if (sortMode === "chrono") {
    const items = DATA.filter(function (d) { return matchesFilter(d, filter); })
      .slice()
      .sort(function (a, b) { return CHRON_ORDER[a.id] - CHRON_ORDER[b.id]; });
    const cardsHtml = items.map(buildCardHtml).join("");
    main.innerHTML = '<section class="saga"><div class="saga-head"><h2 class="display-font">Orden Cronológico</h2></div>' +
      '<div class="grid">' + cardsHtml + "</div></section>";
    return;
  }

  main.innerHTML = SAGAS.map(function (saga) {
    const sagaHasVisibleItems = saga.phases.some(function (p) {
      return DATA.filter(function (d) { return d.phase === p && matchesFilter(d, filter); }).length > 0;
    });
    if (!sagaHasVisibleItems) return "";

    const complete = sagaComplete(status, saga);
    const phasesHtml = saga.phases.map(function (phaseNum) {
      const meta = PHASES[phaseNum];
      const stats = phaseStats(status, phaseNum);
      const items = DATA.filter(function (d) { return d.phase === phaseNum && matchesFilter(d, filter); });
      if (items.length === 0) return "";
      const collapsed = !!collapsedPhases[phaseNum];
      const cardsHtml = items.map(buildCardHtml).join("");

      return '<div class="phase-block">' +
        '<div class="phase-head" data-phase="' + phaseNum + '" onclick="togglePhaseCollapse(' + phaseNum + ')" style="cursor:pointer;">' +
        '<span class="phase-chevron' + (collapsed ? " collapsed" : "") + '">' + chevronSvg + "</span>" +
        phaseGemSvg.replace("STROKECOLOR", meta.color) +
        "<h3>" + meta.label + '</h3><span class="phase-count">' + stats.done + "/" + stats.total + "</span></div>" +
        '<div class="phase-bar-outer">' + buildBarSegments(stats.done, stats.summary, stats.skip, stats.released, WATCHED_COLOR) + "</div>" +
        '<div class="phase-grid-wrap" data-phase="' + phaseNum + '" style="max-height:' + (collapsed ? "0px" : "none") + '">' +
        '<div class="grid">' + cardsHtml + "</div></div>" +
        "</div>";
    }).join("");

    return '<section class="saga"><div class="saga-head"><h2 class="display-font">' + saga.label + "</h2>" +
      (complete ? '<span class="saga-complete">completa</span>' : "") + "</div>" + phasesHtml + "</section>";
  }).join("");
}

let quizItemId = null;
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizCurrentOptions = [];
let quizCurrentCorrect = 0;

function shuffleOptions(options, correctIdx) {
  const indices = options.map(function (_, i) { return i; });
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }
  const shuffled = indices.map(function (i) { return options[i]; });
  const newCorrect = indices.indexOf(correctIdx);
  return { shuffled: shuffled, correct: newCorrect };
}

function startQuiz(itemId) {
  quizItemId = itemId;
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  document.getElementById("quizBackdrop").classList.add("show");
  renderQuizQuestion();
}

function closeQuiz() {
  quizItemId = null;
  document.getElementById("quizBackdrop").classList.remove("show");
}

function retryQuiz() {
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const questions = QUIZZES[quizItemId] || [];
  document.getElementById("quizBarInner").style.width = Math.round((quizIndex / questions.length) * 100) + "%";
  document.getElementById("quizProgress").textContent = "Pregunta " + (quizIndex + 1) + " de " + questions.length;

  const q = questions[quizIndex];
  const result = shuffleOptions(q[1], q[2]);
  quizCurrentOptions = result.shuffled;
  quizCurrentCorrect = result.correct;

  const body = document.getElementById("quizBody");
  body.innerHTML = '<p class="quiz-question">' + escapeHtml(q[0]) + "</p>" +
    quizCurrentOptions.map(function (opt, i) {
      return '<button class="quiz-option" data-i="' + i + '" onclick="selectQuizAnswer(' + i + ')">' + escapeHtml(opt) + "</button>";
    }).join("");
}

function selectQuizAnswer(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const questions = QUIZZES[quizItemId] || [];
  const correct = quizCurrentCorrect;
  if (i === correct) quizScore++;

  const buttons = document.querySelectorAll("#quizBody .quiz-option");
  buttons.forEach(function (btn, idx) {
    if (idx === correct) btn.classList.add("correct");
    else if (idx === i) btn.classList.add("incorrect");
  });

  const isLast = quizIndex === questions.length - 1;
  const nextBtn = document.createElement("button");
  nextBtn.className = "quiz-next";
  nextBtn.textContent = isLast ? "Ver resultado" : "Siguiente";
  nextBtn.onclick = isLast ? showQuizResult : nextQuizQuestion;
  document.getElementById("quizBody").appendChild(nextBtn);
}

function nextQuizQuestion() {
  quizIndex++;
  quizAnswered = false;
  renderQuizQuestion();
}

function showQuizResult() {
  const questions = QUIZZES[quizItemId] || [];
  document.getElementById("quizBarInner").style.width = "100%";
  document.getElementById("quizProgress").textContent = "Resultado";

  let verdict;
  if (quizScore === questions.length) verdict = "Perfecto. No se te escapó nada.";
  else if (quizScore >= 8) verdict = "Prestaste muchísima atención.";
  else if (quizScore >= 6) verdict = "Muy bien, te acordás de lo importante.";
  else if (quizScore >= 4) verdict = "Nada mal, aunque algo se te escapó.";
  else verdict = "Che, capaz conviene volver a verla.";

  document.getElementById("quizBody").innerHTML =
    '<p class="quiz-score">' + quizScore + "/" + questions.length + "</p>" +
    '<p class="quiz-verdict">' + verdict + "</p>" +
    '<div class="quiz-actions"><button id="quizRetryBtn" onclick="retryQuiz()">Reintentar</button>' +
    '<button id="quizCloseBtn" onclick="closeQuiz()">Cerrar</button></div>';
}

  fetchAllPosters(missingPosters, function (id, url) {
    posters[id] = url || "";
    render();
  }).then(savePosterCache);
}
</script>
