<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cronología UCM</title>
<meta name="theme-color" content="#12162A" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap');
  /* ===== Estilo cómic =====
     Los estados se distinguen por forma y brillo (no solo por color):
     vista = sticker redondo claro con tilde, resumen = sticker cuadrado celeste con rayitas,
     no la quiero ver = sticker oscuro con cruz, sin ver = póster en blanco y negro. */
  :root {
    --bg: #12162A; --ink: #000; --paper: #FFF8E7; --panel: #1A1F3A; --panel-2: #232842;
    --text: #FFF8E7; --muted: #9EA3C4; --dim: #6E7396; --accent: #7DD3FC; --accent-2: #38BDF8;
    --line: #3A4064;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; color: var(--text); font-family: Inter, sans-serif; padding-bottom: 60px;
    background: radial-gradient(circle, rgba(255,255,255,.055) 1px, transparent 1.3px) 0 0/8px 8px, var(--bg); background-attachment: fixed; }
  button { font-family: inherit; touch-action: manipulation; }
  .display-font, .bng { font-family: Bangers, cursive; font-weight: 400; letter-spacing: .05em; }
  .bg-decor { display: none; }
  header, main, footer { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; }
  header { padding: 26px 16px 18px; }
  .eyebrow { font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 2px; }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .marvel-logo { height: 32px; width: auto; display: block; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }
  h1 { font-size: 30px; line-height: 1; letter-spacing: .04em; color: var(--text); margin: 0 0 12px; text-shadow: 2px 2px 0 var(--ink); }

  /* pestañas y filtros: etiquetas de cómic */
  .controls-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .control-group { display: flex; gap: 5px; flex-wrap: wrap; }
  .control-sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  .mini-toggle { font-family: Bangers, cursive; font-size: 12.5px; letter-spacing: .06em; padding: 3px 9px 2px; cursor: pointer;
    border: 1.5px solid var(--ink); background: var(--panel-2); color: #B9BCD6; text-transform: uppercase; transition: transform .12s ease, box-shadow .12s ease; }
  .mini-toggle.active { background: var(--paper); color: #000; box-shadow: 2px 2px 0 var(--ink); transform: translate(-1px, -1px); }
  .mini-toggle:active { transform: translate(1px, 1px); box-shadow: none; }
  #ucmControls .mini-toggle, #podiumControls .mini-toggle { font-size: 11.5px; padding: 2px 7px 1px; }
  #viewToggle button svg { color: var(--muted); }

  /* gemas de fases */
  .gauge { display: flex; justify-content: space-between; gap: 6px; margin: 4px 0 14px; max-width: 420px; }
  .gem-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .gem { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--ink); background: var(--panel); }
  .gem.gem-done { background: var(--paper); box-shadow: 2px 2px 0 var(--ink); }
  .gem.gem-partial { background: var(--panel-2); outline: 1.5px dashed var(--accent); outline-offset: 2px; }
  .gem-num { font-size: 9.5px; color: var(--dim); }
  .gem-done + .gem-num { color: var(--text); }

  /* progreso */
  .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .count { font-family: Bangers, cursive; font-size: 24px; letter-spacing: .03em; color: var(--text); margin: 0; }
  .count span { font-family: Inter, sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  button.reset { display: flex; align-items: center; gap: 5px; font-family: Bangers, cursive; font-size: 12.5px; letter-spacing: .06em; color: #C9CCE6;
    border: 1.5px solid var(--ink); background: var(--panel-2); padding: 3px 9px 2px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  button.reset:active { transform: translate(2px, 2px); box-shadow: none; }
  .progress-outer { width: 100%; height: 10px; overflow: hidden; background: var(--panel-2); border: 1.5px solid var(--ink); display: flex; }
  .phase-bar-outer { width: 100%; height: 5px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--ink); margin-bottom: 12px; display: flex; }
  .bar-seg { height: 100%; transition: width .4s ease; }
  .seg-w { background: repeating-linear-gradient(45deg, var(--accent) 0 4px, var(--accent-2) 4px 8px); }
  .seg-s { background: rgba(255,248,231,.65); }
  .seg-k { background: var(--line); }
  .upcoming-note { font-size: 11px; color: var(--dim); margin: 6px 0 0; min-height: 1px; }

  /* sagas y fases */
  main { padding: 0 16px; }
  section.saga { margin-bottom: 34px; }
  .saga-head { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 0 14px; border-bottom: 2px solid var(--ink); box-shadow: 0 2px 0 #2A3058; padding-bottom: 4px; }
  .saga-head h2 { font-size: 21px; color: var(--text); margin: 0; }
  .saga-complete { font-family: Bangers, cursive; font-size: 12px; letter-spacing: .06em; color: #000; background: var(--paper); border: 1.5px solid var(--ink); padding: 1px 7px 0; transform: rotate(-3deg); box-shadow: 2px 2px 0 var(--ink); }
  .phase-block { margin-bottom: 26px; }
  .phase-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; user-select: none; }
  .phase-head h3 { font-family: Bangers, cursive; font-weight: 400; font-size: 18px; letter-spacing: .06em; color: var(--text); margin: 0; }
  .phase-count { font-size: 10.5px; color: var(--muted); margin-left: auto; text-align: right; }
  .phase-chevron { transition: transform .18s ease; flex-shrink: 0; display: flex; }
  .phase-chevron.collapsed { transform: rotate(-90deg); }
  /* al abrir/cerrar solo se anima el alto de la lista; los espacios van adentro para que todo se mueva junto */
  .phase-grid-wrap { overflow: hidden; transition: max-height .32s ease; margin-right: -8px; }
  .phase-grid-wrap > .grid { padding: 14px 8px 18px 0; }
  /* encabezado de fase/grupo: siempre una franja de viñeta; abierta lleva la barra de progreso pegada abajo */
  .phase-head { padding: 8px 10px; background: var(--panel); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); margin-bottom: 0; }
  .phase-head h3 { font-size: 16px; }
  /* mosaico de estudios (prueba) */
  .brand-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; }
  @media (min-width: 480px) { .brand-grid { grid-template-columns: repeat(4, 1fr); } }
  .brand-tile { position: relative; aspect-ratio: 16 / 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px 6px; cursor: pointer;
    background: radial-gradient(120% 90% at 50% 115%, var(--brand-glow) 0%, var(--brand) 32%, transparent 72%), #0E1226;
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transition: transform .12s ease, box-shadow .12s ease; }
  .brand-tile:active { transform: translate(3px, 3px); box-shadow: none; }
  .brand-tile { aspect-ratio: auto; justify-content: flex-start; gap: 4px; padding: 12px 8px 10px; }
  .brand-logo { height: 34px; width: 100%; display: flex; align-items: center; justify-content: center; }
  .brand-logo img { max-width: 86%; max-height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .brand-name { font-family: Bangers, cursive; font-size: 13px; letter-spacing: .06em; color: var(--text); text-shadow: 1px 1px 0 #000; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .brand-count { font-size: 10px; color: #E4E6F5; text-shadow: 1px 1px 0 #000; }
  .brand-bar { width: 100%; height: 6px; display: flex; overflow: hidden; background: rgba(10,12,28,.75); border: 1.5px solid var(--ink); margin-top: 3px; }
  .brand-tile.active { outline: 2.5px solid var(--paper); outline-offset: 2px; }
  .brand-tile.active::after { content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); border: 7px solid transparent; border-top-color: var(--paper); }
  .universe-page { scroll-margin-top: 12px; margin-top: 22px; }
  .universe-page.fresh { animation: panelIn .28s ease; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(8px); } }
  .universe-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .universe-head h2 { font-size: 21px; margin: 0; color: var(--text); }
  .universe-page .phase-bar-outer { margin-bottom: 4px; }
  .universe-grid { padding: 14px 8px 0 0; margin-right: -8px; }

  .phase-head + .phase-bar-outer { margin: 0 2px 0 0; height: 5px; border-top: 0; }
  .phase-block { margin-bottom: 10px; }

  /* tarjetas */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  .card { text-align: left; background: none; border: none; padding: 0; cursor: pointer; color: inherit; transition: transform .14s ease; }
  .card:active { transform: scale(0.96); }
  .poster-box { position: relative; width: 100%; aspect-ratio: 2 / 3; margin-bottom: 7px; background: #0B0D1A; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; text-align: center; }
  .poster-clip { position: absolute; inset: 0; overflow: hidden; }
  .poster-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .35s ease; }
  .card.st-skip .poster-box img { filter: brightness(.4) saturate(.6); }
  /* visto vs. no visto por brillo: lo visto lleva borde claro y a pleno; lo no visto, un poco apagado (en color) */
  .card.st-watched .poster-box { border-color: var(--paper); }
  /* filete negro por dentro del borde claro, para que se vea también en pósters blancos */
  .card.st-watched .poster-clip::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1.5px #000; pointer-events: none; z-index: 1; }
  .card.unseen .poster-box img { filter: brightness(.68) saturate(.85); }
  .card.unseen:hover .poster-box img { filter: brightness(.85) saturate(.95); }
  .poster-box img.blurred { filter: blur(10px) brightness(.8) !important; }
  .placeholder-title { font-size: 9px; line-height: 1.2; color: rgba(255,248,231,.75); position: relative; z-index: 1; }
  .type-tag { position: absolute; top: -7px; left: -6px; z-index: 4; display: inline-flex; align-items: center; gap: 3px; pointer-events: none;
    font-family: Bangers, cursive; font-size: 10.5px; letter-spacing: .06em; line-height: 1; color: var(--text); text-transform: uppercase;
    background: #12162A; border: 1.5px solid var(--ink); box-shadow: 1.5px 1.5px 0 var(--ink); padding: 3px 5px 2px 4px; transform: rotate(-3deg); }
  .card.locked .type-tag { display: none; }
  .stk { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; display: grid; place-items: center; border: 2px solid var(--ink); box-shadow: 1.5px 1.5px 0 var(--ink); z-index: 4; pointer-events: none; }
  .stk-w { background: var(--paper); border-radius: 50%; }
  .stk-s { background: var(--accent); border-radius: 4px; transform: rotate(8deg); }
  .stk-k { background: #2A2F4C; border-radius: 4px; transform: rotate(-6deg); }
  .card.pop .stk { animation: stickerPop .42s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes stickerPop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1); } }
  .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    background: repeating-linear-gradient(-45deg, #161A30 0 6px, #12162A 6px 12px); text-align: center; padding: 6px; z-index: 3; }
  .lock-label { font-family: Bangers, cursive; font-size: 12px; letter-spacing: .06em; color: var(--muted); }
  .lock-date { font-size: 9px; color: var(--dim); }
  .card-title { font-size: 11px; font-weight: 600; line-height: 1.22; margin: 0; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 27px; }
  .card.st-skip .card-title, .card.locked .card-title { color: var(--dim); }
  .card-year { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 9.5px; color: var(--muted); margin: 2px 0 0; }
  .card-year .meta { display: inline-flex; align-items: center; gap: 3px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .card-rating-inline { color: var(--text); flex-shrink: 0; }
  /* fotogramas de escenas post-créditos: hueco = a mitad de créditos, lleno = al final */
  .fr { display: inline-flex; gap: 2px; margin-left: 3px; flex-shrink: 0; }
  .fr b { width: 5px; height: 8px; border: 1.2px solid #C9CCE6; border-radius: 1px; display: inline-block; }
  .fr b.e { background: var(--paper); border-color: var(--paper); }
  .fr.approx b { border-style: dashed; }
  @keyframes flashCard { 0%, 65% { box-shadow: 0 0 0 3px var(--accent), 3px 3px 0 var(--ink); } 100% { box-shadow: 3px 3px 0 var(--ink); } }
  .card.flash .poster-box { animation: flashCard 2.2s ease-out; }

  footer { padding: 28px 16px 16px; }
  footer p { font-size: 10px; color: var(--dim); }
  #toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -12px) rotate(-2deg); opacity: 0; z-index: 60; padding: 6px 16px 4px;
    font-family: Bangers, cursive; font-size: 18px; letter-spacing: .06em; background: var(--paper) !important; color: #000 !important; border: 2.5px solid var(--ink) !important;
    box-shadow: 4px 4px 0 var(--ink); transition: all .22s cubic-bezier(.2, 1.4, .4, 1); pointer-events: none; max-width: 85vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-2deg); }
  .modal-label { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: #555; font-weight: 600; margin: 0 0 8px; }

  /* hojas (menú, quiz): viñeta clara que sube desde abajo */
  #statusBackdrop, #quizBackdrop { position: fixed; inset: 0; background: rgba(6,8,18,.75); display: none; align-items: flex-end; justify-content: center; }
  #statusBackdrop { z-index: 58; } #quizBackdrop { z-index: 55; }
  #statusBackdrop.show, #quizBackdrop.show { display: flex; animation: fadeIn .18s ease; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } }
  @media (min-width: 640px) { #statusBackdrop, #quizBackdrop { align-items: center; } }
  #statusBox, #quizBox { width: 100%; max-width: 440px; padding: 18px 16px max(18px, env(safe-area-inset-bottom)); background: var(--paper); color: #111;
    border: 3px solid var(--ink); border-bottom: 0; max-height: 88vh; overflow-y: auto; animation: sheetUp .26s cubic-bezier(.2, 1.1, .4, 1); }
  @media (min-width: 640px) { #statusBox, #quizBox { border-bottom: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); } }
  #statusItemTitle { font-family: Bangers, cursive; font-size: 23px; letter-spacing: .04em; line-height: 1.05; color: #111; text-transform: none; margin: 0 0 12px; }
  #statusItemTitle:has(+ #statusMeta:not(:empty)) { margin-bottom: 3px; }
  #statusMeta { margin: 6px 0 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1.5px solid var(--ink); padding: 3px 8px; }
  .meta-chip .fr { margin: 0; }
  #statusRatingWidget { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 4px 0 10px; }
  .rate-step { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; background: var(--panel-2); color: var(--text); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; padding: 0; }
  .rate-step:active { transform: translate(2px, 2px); box-shadow: none; }
  #statusRatingWidget .star-rating { gap: 6px; }
  .date-chip { position: relative; display: flex; align-items: center; justify-content: center; gap: 7px; width: fit-content; margin: 0 auto; padding: 5px 12px; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .date-chip.empty { color: var(--muted); border-style: dashed; box-shadow: none; }
  .date-chip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  #statusMeta:empty { display: none; }
  #statusWatchDate { background: #fff; border: 1.5px solid var(--ink); border-radius: 0; color: #111; font-size: 13px; padding: 5px 8px; color-scheme: light; font-family: inherit; }
  #quizLaunchSection { margin-top: 14px; }
  #quizLaunchBtn { font-family: Bangers, cursive; font-size: 19px; letter-spacing: .06em; padding: 8px 12px 6px; width: 100%; text-align: center; color: #000; cursor: pointer;
    background: var(--accent); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  #quizLaunchBtn:active { transform: translate(3px, 3px); box-shadow: none; }
  .status-option { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; background: #fff; border: 1.5px solid var(--ink);
    color: #111; font-size: 14px; font-weight: 500; cursor: pointer; }
  .status-option:active { transform: translate(2px, 2px); }
  .status-option.current { background: #111; color: var(--paper); }
  .status-option-clear { color: #777; }
  .status-option-cancel { display: block; color: #555; margin: 4px 0 0; background: none; border: none; text-align: center; }
  .star-rating { display: flex; gap: 3px; }
  .star-rating .se { stroke: #6E7396; }
  .star-rating .sf { fill: var(--paper); stroke: var(--paper); }
  .star-slot { position: relative; display: inline-block; }
  .star-fill-wrap { position: absolute; top: 0; left: 0; height: 100%; overflow: hidden; display: block; pointer-events: none; }
  .star-fill-wrap svg { display: block; }
  .star-click-left { position: absolute; top: 0; left: 0; width: 50%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .star-click-right { position: absolute; top: 0; right: 0; width: 50%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .podium-edit-row { display: flex; align-items: center; gap: 6px; }
  .podium-adjust { width: 24px; height: 24px; border: 1.5px solid var(--ink); background: #fff; color: #111; font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .podium-row .podium-adjust { background: var(--panel-2); color: var(--text); }

  /* quiz */
  #quizHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #quizProgress { font-family: Bangers, cursive; font-size: 16px; letter-spacing: .06em; color: #111; }
  #quizClose { padding: 5px; background: #fff; border: 1.5px solid var(--ink); cursor: pointer; display: flex; }
  #quizClose svg { stroke: #111; }
  #quizBar { width: 100%; height: 8px; overflow: hidden; background: #E5DCC4; border: 1.5px solid var(--ink); margin-bottom: 16px; }
  #quizBarInner { height: 100%; background: repeating-linear-gradient(45deg, var(--accent) 0 4px, var(--accent-2) 4px 8px); transition: width .25s ease; width: 0%; }
  .quiz-question { font-size: 16px; font-weight: 700; color: #111; margin: 0 0 14px; line-height: 1.4; }
  .quiz-option { display: block; width: 100%; text-align: left; padding: 11px 13px; margin-bottom: 8px; background: #fff; border: 1.5px solid var(--ink); color: #111; font-size: 13.5px; cursor: pointer; }
  .quiz-option.correct { background: #111; color: var(--paper); }
  .quiz-option.correct::before { content: "✓ "; font-weight: 700; }
  .quiz-option.incorrect { background: #fff; color: #888; text-decoration: line-through; border-style: dashed; }
  .quiz-option.incorrect::before { content: "✕ "; text-decoration: none; display: inline-block; }
  .quiz-next { margin-top: 8px; width: 100%; padding: 8px 10px 6px; border: 2px solid var(--ink); background: var(--accent); color: #000; font-family: Bangers, cursive; font-size: 18px; letter-spacing: .06em; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); }
  .quiz-score { font-family: Bangers, cursive; font-size: 54px; letter-spacing: .04em; color: #111; text-align: center; margin: 4px 0 2px; text-shadow: 3px 3px 0 var(--accent); }
  .quiz-verdict { font-size: 14px; color: #333; text-align: center; margin: 0 0 18px; }
  .quiz-actions { display: flex; gap: 10px; }
  .quiz-actions button { flex: 1; padding: 8px 10px 6px; font-family: Bangers, cursive; font-size: 17px; letter-spacing: .06em; cursor: pointer; border: 2px solid var(--ink); }
  #quizRetryBtn { background: var(--accent); color: #000; box-shadow: 3px 3px 0 var(--ink); }
  #quizCloseBtn { background: #fff; color: #111; }

  /* podio: lista; los 3 primeros son filas destacadas */
  .podium-list { display: flex; flex-direction: column; gap: 10px; }
  .podium-row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; color: inherit; cursor: pointer; background: var(--panel); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 8px 10px 8px 8px; }
  .podium-row:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .podium-rank { width: 34px; flex-shrink: 0; text-align: center; font-family: Bangers, cursive; font-size: 24px; color: var(--muted); text-shadow: 2px 2px 0 #000; }
  .podium-thumb { width: 40px; height: 60px; flex-shrink: 0; background: #0B0D1A; border: 1.5px solid var(--ink); overflow: hidden; display: block; }
  .podium-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .podium-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .podium-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podium-year { font-size: 10px; color: var(--muted); }
  .podium-watched { color: #C9CCE6; }
  .podium-noposter { display: flex; align-items: center; justify-content: center; height: 100%; padding: 4px; font-size: 9px; color: var(--muted); text-align: center; }
  /* top 3: mismo tamaño que el resto; el puesto es una copa (o laurel) con el número */
  .podium-rank.award { position: relative; width: 52px; height: 52px; display: grid; place-items: center; text-shadow: none; }
  .award-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .podium-rank.award i { position: relative; font-style: normal; font-family: Bangers, cursive; color: #000; font-size: 17px; line-height: 1; }
  .podium-rank.award.laurel i { font-size: 23px; margin-top: -4px; -webkit-text-stroke: 1px #000; text-shadow: 1.5px 1.5px 0 #000; }
  .podium-rank.award.r1 i { color: #FFE58A; } .podium-rank.award.r2 i { color: #F1F4FA; } .podium-rank.award.r3 i { color: #F6C08F; }
  .podium-rank.award.r1 .award-svg { filter: drop-shadow(0 0 4px rgba(233,185,58,.45)); }
  .podium-row.top1 { position: relative; overflow: hidden; }
  .podium-row.top1::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,240,200,.14), transparent); animation: podiumGlint 5s ease-in-out infinite 1s; }
  @keyframes podiumGlint { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .podium-list .podium-row.top3 + .podium-row:not(.top) { margin-top: 6px; }
  .order-open-btn { display: inline-flex; align-items: center; gap: 4px; }
  #orderBackdrop { position: fixed; inset: 0; z-index: 57; background: rgba(6,8,18,.8); display: none; align-items: flex-end; justify-content: center; }
  #orderBackdrop.show { display: flex; animation: fadeIn .18s ease; }
  @media (min-width: 640px) { #orderBackdrop { align-items: center; } }
  #orderBox { width: 100%; max-width: 460px; height: min(82vh, 640px); display: flex; flex-direction: column; background: var(--paper); color: #111; border: 3px solid var(--ink); border-bottom: 0;
    padding: 14px 14px max(14px, env(safe-area-inset-bottom)); animation: sheetUp .24s cubic-bezier(.2, 1.1, .4, 1); }
  @media (min-width: 640px) { #orderBox { border-bottom: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); } }
  #orderHeader { display: flex; align-items: center; justify-content: space-between; font-size: 22px; }
  #orderClose { padding: 5px; background: #fff; border: 1.5px solid var(--ink); cursor: pointer; display: flex; }
  #orderLevels { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 12px; }
  .order-level-now { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .order-level-now small { font-size: 11px; color: var(--muted); }
  .order-arrow { width: 38px; height: 38px; display: grid; place-items: center; background: var(--panel-2); color: var(--text); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; }
  .order-arrow:active { transform: translate(2px, 2px); box-shadow: none; }
  .order-arrow:disabled { opacity: .3; cursor: default; box-shadow: none; }
  #orderList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 6px 2px; overscroll-behavior: contain; }
  .order-row { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 6px 8px; background: #fff; border: 1.5px solid var(--ink); position: relative; transition: transform .15s ease, box-shadow .15s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; cursor: grab; }
  .order-row.lifting { transform: scale(1.02); }
  .order-row.dragging { transition: none; z-index: 2; box-shadow: 4px 6px 0 var(--ink); background: #FFFDF5; }
  .order-pos { width: 30px; flex-shrink: 0; text-align: center; font-family: Bangers, cursive; font-size: 22px; color: #111; }
  .order-thumb { width: 34px; height: 51px; flex-shrink: 0; background: #0B0D1A; border: 1.5px solid var(--ink); overflow: hidden; }
  .order-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .order-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .order-title small { display: block; font-size: 10.5px; font-weight: 400; color: #666; }
  .order-handle { padding: 10px 6px; color: #111; display: flex; pointer-events: none; }
  .order-row.dragging .order-handle { cursor: grabbing; }
  #orderDoneBtn { margin-top: 10px; font-family: Bangers, cursive; font-size: 18px; letter-spacing: .06em; padding: 7px 0 5px; background: var(--accent); color: #000; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
  .podium-hint { font-size: 11px; color: var(--dim); text-align: center; margin: 16px 0 0; }
  .podium-empty { color: var(--muted); text-align: center; padding: 50px 20px; font-size: 14px; }

  /* confirmación */
  #confirmBackdrop { position: fixed; inset: 0; z-index: 59; background: rgba(6,8,18,.78); display: none; align-items: center; justify-content: center; padding: 22px; }
  #confirmBackdrop.show { display: flex; animation: fadeIn .15s ease; }
  #confirmBox { width: 100%; max-width: 340px; padding: 16px; background: var(--paper); color: #111; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); animation: sheetUp .22s cubic-bezier(.2, 1.2, .4, 1); }
  #confirmTitle { font-family: Bangers, cursive; font-size: 24px; letter-spacing: .05em; margin: 0; }
  #confirmMessage { font-size: 13px; line-height: 1.5; color: #333; margin: 6px 0 16px; }
  .reset-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: #555; margin: 12px 0 6px; }
  .reset-scope { display: flex; gap: 6px; flex-wrap: wrap; }
  .scope-opt { font-family: Bangers, cursive; font-size: 14px; letter-spacing: .05em; padding: 4px 10px 2px; border: 1.5px solid var(--ink); background: #fff; color: #111; cursor: pointer; }
  .scope-opt.active { background: #111; color: var(--paper); box-shadow: 2px 2px 0 var(--accent-2); }
  .reset-check { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; line-height: 1.35; color: #111; padding: 7px 0; cursor: pointer; }
  .reset-check small { color: #666; }
  .reset-check input { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; flex-shrink: 0; margin: 0; border: 2px solid var(--ink); background: #fff; display: grid; place-items: center; cursor: pointer; }
  .reset-check input::after { content: ""; width: 9px; height: 5px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
  .reset-check input:checked { background: #111; }
  .reset-check input:checked::after { opacity: 1; }
  .reset-check input:disabled { opacity: .5; }
  #confirmYesBtn:disabled { opacity: .35; cursor: default; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions button { flex: 1; padding: 8px 10px 6px; font-family: Bangers, cursive; font-size: 17px; letter-spacing: .06em; cursor: pointer; border: 2px solid var(--ink); }
  #confirmYesBtn { background: #fff; color: #111; border-style: dashed; }
  #confirmNoBtn { background: #111; color: var(--paper); box-shadow: 3px 3px 0 var(--ink); }

  /* buscador */
  #searchBackdrop { position: fixed; inset: 0; z-index: 52; display: none; flex-direction: column;
    background: radial-gradient(circle, rgba(255,255,255,.055) 1px, transparent 1.3px) 0 0/8px 8px, var(--bg); }
  #searchBackdrop.show { display: flex; }
  #searchTop { display: flex; gap: 10px; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px 10px; }
  #searchInput { flex: 1; min-width: 0; font-size: 16px; font-family: inherit; color: #111; background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 0; padding: 9px 12px; outline: none; -webkit-appearance: none; appearance: none; }
  #searchCloseBtn { font-family: Bangers, cursive; font-size: 15px; letter-spacing: .06em; background: var(--panel-2); border: 1.5px solid var(--ink); color: #C9CCE6; cursor: pointer; padding: 4px 10px 3px; }
  #searchResults { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px max(24px, env(safe-area-inset-bottom)); }
  .search-hint, .search-count { color: var(--muted); font-size: 12px; margin: 10px 2px; }
  .search-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px; margin-bottom: 10px; background: var(--panel); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); color: inherit; cursor: pointer; }
  .search-row-locked { opacity: 0.55; }
  .search-thumb { width: 40px; height: 60px; overflow: hidden; flex-shrink: 0; background: #0B0D1A; border: 1.5px solid var(--ink); }
  .search-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .search-thumb img.blurred { filter: blur(6px); }
  .search-info { flex: 1; min-width: 0; }
  .search-title { font-size: 14px; font-weight: 600; color: var(--text); margin: 0 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-meta { font-size: 11px; color: var(--muted); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== Ventanas en modo oscuro (menú, quiz, reiniciar, ordenar, avisos, buscador) ===== */
  #statusBox, #quizBox, #confirmBox, #orderBox { background: var(--panel); color: var(--text); }
  .modal-label, .reset-label { color: var(--muted); }
  #statusItemTitle, #quizProgress, .quiz-question, #confirmTitle, #orderHeader { color: var(--text); }
  #statusMeta { color: var(--muted); }
  #statusWatchDate { color-scheme: dark; }
  .podium-date { background: #10142A; color: var(--text); border-color: var(--ink); color-scheme: dark; }
  .status-option { background: var(--panel-2); color: var(--text); }
  .status-option.current { background: var(--paper); color: #000; }
  .status-option-clear { color: var(--muted); }
  .status-option-cancel { color: var(--muted); background: none; }
  .podium-adjust { background: var(--panel-2); color: var(--text); }
  #quizClose, #orderClose { background: var(--panel-2); }
  #quizClose svg, #orderClose svg { stroke: var(--text); }
  #quizBar { background: #10142A; }
  .quiz-option { background: var(--panel-2); color: var(--text); }
  .quiz-option.correct { background: var(--paper); color: #000; }
  .quiz-option.incorrect { background: var(--panel); color: var(--dim); }
  .quiz-score { color: var(--text); text-shadow: 3px 3px 0 #000, 5px 5px 0 var(--accent-2); }
  .quiz-verdict { color: #C9CCE6; }
  #quizCloseBtn { background: var(--panel-2); color: var(--text); }
  #confirmMessage { color: #C9CCE6; }
  .scope-opt { background: var(--panel-2); color: var(--text); }
  .scope-opt.active { background: var(--paper); color: #000; }
  .reset-check { color: var(--text); }
  .reset-check small { color: var(--muted); }
  .reset-check input { background: #10142A; }
  .reset-check input::after { border-color: #000; }
  .reset-check input:checked { background: var(--paper); }
  #confirmYesBtn { background: var(--panel-2); color: var(--text); }
  #confirmNoBtn { background: var(--paper); color: #000; }
  .order-row { background: var(--panel-2); }
  .order-row.dragging { background: #2C3360; }
  .order-pos, .order-handle { color: var(--text); }
  .order-title small { color: var(--muted); }
  #toast { background: var(--panel) !important; color: var(--text) !important; }
  #searchInput { background: #10142A; color: var(--text); }
  #searchInput::placeholder { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  async function worker() {
    while (cursor < items.length) {
      const item = items[cursor++];
      let data = null;
      try { data = await fetchLength(item); } catch (e) {}
      lengthCache = Object.assign({}, lengthCache);
      lengthCache[item.id] = { t: Date.now(), data: data };
    }
  }
  await Promise.all([worker(), worker()]);
  saveLengthCache();
  onDone();
}

async function fetchAllPosters(items, onEach, concurrency = 4) {
  let cursor = 0;
  async function worker() {
    while (cursor < items.length) {
      const item = items[cursor++];
      const url = await fetchPoster(item);
      onEach(item.id, url);
    }
  }
  await Promise.all(new Array(Math.min(concurrency, items.length)).fill(0).map(worker));
}

  const prevPhaseComplete = {};
  const prevSagaComplete = {};

  SAGAS.forEach(function (s) { prevSagaComplete[s.id] = sagaComplete(status, s); });

  if (newStatus === "watched" && status[id] !== "watched") setWatchDate(id, todayIso());
  else if (newStatus !== "watched" && watchDates[id]) setWatchDate(id, null);

  const next = Object.assign({}, status);
  if (newStatus) next[id] = newStatus; else delete next[id];
  status = next;

  SAGAS.forEach(function (s) {
    if (!prevSagaComplete[s.id] && sagaComplete(status, s)) showToast("¡" + s.label + " completada!", "#D8B23A");

  Object.keys(PHASES).forEach(function (p) {

// Puestos 1-3 del podio: corona de laurel en oro, plata y bronce.
const METALS = {
  1: { light: "#FFF3B0", mid: "#E9B93A", dark: "#9A6A12", text: "#FFE58A" },
  2: { light: "#FFFFFF", mid: "#C9D2E0", dark: "#7A8598", text: "#F1F4FA" },
  3: { light: "#FFD3A8", mid: "#C97A3E", dark: "#7A3F17", text: "#F6C08F" },
};
function laurelSvg(rank) {
  const m = METALS[rank], g = "metal" + rank;
  const LEAF = "M0 0 C3.4 -3.6 3.4 -8.6 0 -12.5 C-3.4 -8.6 -3.4 -3.6 0 0Z"; // hoja en punta, apuntando hacia arriba
  const r = 17, cx = 24, cy = 25;
  const pt = function (deg) { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  let leaves = "";
  // de abajo hacia arriba por el lado izquierdo: pares de hojas (una hacia afuera, otra hacia adentro), más chicas hacia la punta
  for (let i = 0; i < 6; i++) {
    const deg = 248 - i * 20, p = pt(deg), q = pt(deg - 10);
    const dir = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI + 90;
    const sc = (1 - i * 0.07).toFixed(2);
    leaves += '<path d="' + LEAF + '" transform="translate(' + p[0].toFixed(2) + " " + p[1].toFixed(2) + ") rotate(" + (dir - 32).toFixed(1) + ") scale(" + sc + ')"/>';
    leaves += '<path d="' + LEAF + '" transform="translate(' + p[0].toFixed(2) + " " + p[1].toFixed(2) + ") rotate(" + (dir + 30).toFixed(1) + ") scale(" + (sc * 0.85).toFixed(2) + ')"/>';
  }
  const tip = pt(126), tq = pt(118);
  leaves += '<path d="' + LEAF + '" transform="translate(' + tip[0].toFixed(2) + " " + tip[1].toFixed(2) + ") rotate(" + (Math.atan2(tq[1] - tip[1], tq[0] - tip[0]) * 180 / Math.PI + 90).toFixed(1) + ') scale(.7)"/>';
  const stem = pt(250), stemEnd = pt(130);
  const branch = '<path d="M' + stem[0].toFixed(2) + " " + stem[1].toFixed(2) + " A" + r + " " + r + " 0 0 1 " + stemEnd[0].toFixed(2) + " " + stemEnd[1].toFixed(2) + '" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>' +
    '<g fill="url(#' + g + ')" stroke="#000" stroke-width="0.9" stroke-linejoin="round">' + leaves + "</g>";
  return '<svg class="award-svg" viewBox="0 0 48 48" aria-hidden="true"><defs>' +
    '<linearGradient id="' + g + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + m.light + '"/><stop offset=".5" stop-color="' + m.mid + '"/><stop offset="1" stop-color="' + m.dark + '"/></linearGradient></defs>' +
    branch + '<g transform="matrix(-1 0 0 1 48 0)">' + branch + "</g>" +
    '<path d="M24 41.5 L18.8 47 L21.3 42 Z M24 41.5 L29.2 47 L26.7 42 Z" fill="url(#' + g + ')" stroke="#000" stroke-width="1"/>' +
    '<circle cx="24" cy="41.5" r="2.2" fill="url(#' + g + ')" stroke="#000" stroke-width="1"/>' +
    "</svg>";
}
// Fila del podio. Los 3 primeros son filas destacadas; editar = tocarla y usar el menú.
function buildPodiumRow(item, rank) {
  const date = watchDates[item.id];
  const top = rank <= 3 ? " top top" + rank : "";
  return '<button class="podium-row' + top + '"' + podiumTap(item) + ">" +
    (rank <= 3
      ? '<span class="podium-rank award laurel r' + rank + '">' + laurelSvg(rank) + "<i>" + rank + "</i></span>"
      : '<span class="podium-rank">' + rank + "</span>") +
    '<span class="podium-thumb">' + podiumPoster(item) + "</span>" +
    '<span class="podium-info">' +
      '<span class="podium-title">' + escapeHtml(item.es) + "</span>" +
      '<span class="podium-year">' + item.year + (date ? ' · <span class="podium-watched">vista el ' + formatDate(date) + "</span>" : "") + "</span>" +
      buildStarRating(item.id, ratings[item.id], 14, false) +
    "</span></button>";
}
// Ventana "Ordenar": por nivel de estrellas, arrastrar para decidir el orden dentro del empate.
const STAR_LEVELS = [5, 4.5, 4, 3.5, 3, 2.5, 2, 1.5, 1, 0.5];
let orderLevel = null;
function starLabel(r) { return String(r).replace(".5", "½").replace(/^0½$/, "½") + " ★"; }
function ratedAll() { return DATA.concat(OTHER_DATA).filter(function (d) { return ratings[d.id] > 0; }); }
function levelItems(r) { return ratedAll().filter(function (d) { return ratings[d.id] === r; }).sort(compareRated); }
function openOrder() {
  const counts = {};
  ratedAll().forEach(function (d) { counts[ratings[d.id]] = (counts[ratings[d.id]] || 0) + 1; });
  if (orderLevel === null || !counts[orderLevel]) {
    orderLevel = STAR_LEVELS.filter(function (r) { return counts[r] > 1; })[0] || STAR_LEVELS.filter(function (r) { return counts[r]; })[0] || 5;
  }
  document.getElementById("orderBackdrop").classList.add("show");
  renderOrder();
}
function closeOrder() {
  document.getElementById("orderBackdrop").classList.remove("show");
  render();
}
function setOrderLevel(r) { orderLevel = r; renderOrder(); }
function renderOrder() {
  const counts = {};
  ratedAll().forEach(function (d) { counts[ratings[d.id]] = (counts[ratings[d.id]] || 0) + 1; });
  // selector con flechas: solo niveles que tienen títulos (de 5 ★ hacia abajo)
  const levels = STAR_LEVELS.filter(function (r) { return counts[r]; });
  const idx = levels.indexOf(orderLevel);
  const more = levels[idx - 1], less = levels[idx + 1]; // levels va de 5 ★ hacia abajo
  const n = counts[orderLevel] || 0;
  const arrow = function (target, dir) {
    return '<button class="order-arrow"' + (target !== undefined ? ' onclick="setOrderLevel(' + target + ')"' : " disabled") + ' aria-label="' + (dir < 0 ? "Menos estrellas" : "Más estrellas") + '">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="' + (dir < 0 ? "m15 18-6-6 6-6" : "m9 18 6-6-6-6") + '"/></svg></button>';
  };
  document.getElementById("orderLevels").innerHTML = arrow(less, -1) +
    '<div class="order-level-now">' + buildStarRating("lvl", orderLevel, 20, false) + "<small>" + n + (n === 1 ? " título" : " títulos") + "</small></div>" +
    arrow(more, 1);
  const items = levelItems(orderLevel);
  const base = ratedAll().filter(function (d) { return ratings[d.id] > orderLevel; }).length + 1;
  document.getElementById("orderList").innerHTML = items.map(function (d, i) {
    const p = posters[d.id];
    return '<div class="order-row" data-id="' + d.id + '">' +
      '<span class="order-pos">' + (base + i) + "</span>" +
      '<span class="order-thumb">' + (p ? '<img src="' + p + '" alt="" />' : "") + "</span>" +
      '<span class="order-title">' + escapeHtml(d.es) + "<small>" + d.year + "</small></span>" +
      (items.length > 1 ? '<span class="order-handle" aria-label="Arrastrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg></span>' : "") +
      "</div>";
  }).join("");
  document.getElementById("orderList").dataset.base = base;
}
function saveLevelOrder() {
  const ids = [].map.call(document.querySelectorAll("#orderList .order-row"), function (r) { return r.dataset.id; });
  tiebreak = Object.assign({}, tiebreak);
  ids.forEach(function (id, i) { tiebreak[id] = { r: orderLevel, o: i }; });
  saveTiebreak();
}
// Arrastre: con el mouse arranca al instante; con el dedo, después de dejarlo apoyado un momento
// (así un deslizamiento rápido sigue moviendo la lista).
(function () {
  const HOLD_MS = 220;
  let drag = null, pending = null;
  const list = function () { return document.getElementById("orderList"); };
  function relabel(order) {
    const base = Number(list().dataset.base);
    order.forEach(function (row, i) { row.querySelector(".order-pos").textContent = base + i; });
  }
  function begin(row, y, pointerId) {
    const rows = [].slice.call(list().children);
    if (rows.length < 2) return;
    const step = rows[1].offsetTop - rows[0].offsetTop;
    drag = { row: row, rows: rows, from: rows.indexOf(row), to: rows.indexOf(row), step: step, startY: y, startScroll: list().scrollTop, id: pointerId };
    row.classList.add("dragging");
    try { row.setPointerCapture(pointerId); } catch (err) {}
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
  }
  document.addEventListener("pointerdown", function (e) {
    const row = e.target.closest && e.target.closest("#orderList .order-row");
    if (!row || drag) return;
    if (e.pointerType === "mouse") { e.preventDefault(); begin(row, e.clientY, e.pointerId); return; }
    row.classList.add("lifting");
    pending = { row: row, x: e.clientX, y: e.clientY, id: e.pointerId,
      timer: setTimeout(function () { row.classList.remove("lifting"); begin(row, pending.y, pending.id); pending = null; }, HOLD_MS) };
  });
  function cancelPending() {
    if (!pending) return;
    clearTimeout(pending.timer); pending.row.classList.remove("lifting"); pending = null;
  }
  document.addEventListener("pointermove", function (e) {
    if (pending && e.pointerId === pending.id) {
      if (Math.abs(e.clientY - pending.y) > 8 || Math.abs(e.clientX - pending.x) > 8) cancelPending();
      return;
    }
    if (!drag || e.pointerId !== drag.id) return;
    const l = list(), rect = l.getBoundingClientRect();
    if (e.clientY < rect.top + 36) l.scrollTop -= 8; else if (e.clientY > rect.bottom - 36) l.scrollTop += 8;
    const dy = e.clientY - drag.startY + (l.scrollTop - drag.startScroll);
    drag.row.style.transform = "translateY(" + dy + "px)";
    const to = Math.max(0, Math.min(drag.rows.length - 1, Math.round((drag.from * drag.step + dy) / drag.step)));
    drag.to = to;
    const order = drag.rows.filter(function (r) { return r !== drag.row; });
    order.splice(to, 0, drag.row);
    drag.rows.forEach(function (r, i) {
      if (r === drag.row) return;
      const shift = (order.indexOf(r) - i) * drag.step;
      r.style.transform = shift ? "translateY(" + shift + "px)" : "";
    });
    relabel(order);
  });
  // mientras se arrastra con el dedo, que la lista no se desplace
  document.addEventListener("touchmove", function (e) { if (drag) e.preventDefault(); }, { passive: false });
  function end(e) {
    if (pending && e.pointerId === pending.id) { cancelPending(); return; }
    if (!drag || e.pointerId !== drag.id) return;
    const l = list();
    drag.rows.forEach(function (r) { r.style.transform = ""; });
    drag.row.classList.remove("dragging");
    const ref = drag.rows.filter(function (r) { return r !== drag.row; })[drag.to] || null;
    l.insertBefore(drag.row, ref);
    relabel([].slice.call(l.children));
    if (drag.to !== drag.from) saveLevelOrder();
    drag = null;
  }
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
  document.addEventListener("contextmenu", function (e) { if (e.target.closest && e.target.closest("#orderList")) e.preventDefault(); });
})();

function renderPodiumView() {
  const pool = podiumFilter === "ucm" ? DATA : podiumFilter === "other" ? OTHER_DATA : DATA.concat(OTHER_DATA);
  const totalRated = DATA.concat(OTHER_DATA).filter(function (d) { return ratings[d.id] > 0; }).length;
  const rated = pool.filter(function (d) { return ratings[d.id] > 0; });
  rated.sort(compareRated);

  document.getElementById("count").innerHTML = rated.length + '<span> título' + (rated.length === 1 ? "" : "s") + " calificado" + (rated.length === 1 ? "" : "s") + "</span>";
  document.getElementById("overallBar").innerHTML = "";
  document.getElementById("upcomingNote").textContent = "";

  const main = document.getElementById("main");
  if (rated.length === 0) {
    const msg = totalRated > 0
      ? "Todavía no calificaste nada en " + (podiumFilter === "ucm" ? "el UCM" : "Otros Universos") + "."
      : 'Todavía no calificaste nada. Marcá algo como "Vista" y ponele estrellas para que aparezca acá.';
    main.innerHTML = '<section class="saga"><p class="podium-empty">' + msg + "</p></section>";
    return;
  }

  const rows = rated.map(function (item, i) { return buildPodiumRow(item, i + 1); }).join("");
  main.innerHTML = '<section class="saga">' +
    '<div class="podium-list">' + rows + "</div>" +
    '<p class="podium-hint">Tocá cualquiera para cambiar sus estrellas o la fecha.</p>' +
    "</section>";
}

function universeStats(universeKey) {
  const items = OTHER_DATA.filter(function (d) { return d.universe === universeKey; });
  const rel = items.filter(isReleased);
  const count = function (st) { return rel.filter(function (d) { return status[d.id] === st; }).length; };
  return { items: items, total: items.length, released: rel.length, done: count("watched"), skip: count("skip"), summary: count("summary") };
}

// Otros Universos: mosaico de estudios; al tocar uno, su contenido se abre debajo (tocarlo otra vez lo cierra).
let otherOpen = null;
let universeJustOpened = false; // anima el panel solo al abrirlo, no en cada re-render
function openUniverse(key) {
  otherOpen = otherOpen === key ? null : key;
  savePrefs();
  universeJustOpened = true;
  render();
  universeJustOpened = false;
}

function renderOtherView() {
  const released = OTHER_DATA.filter(isReleased);
  const done = released.filter(function (d) { return status[d.id] === "watched"; });
  const skipTotal = released.filter(function (d) { return status[d.id] === "skip"; });
  const summaryTotal = released.filter(function (d) { return status[d.id] === "summary"; });

  document.getElementById("count").innerHTML = done.length + '<span> / ' + released.length + " vistas</span>";
  document.getElementById("overallBar").innerHTML = buildBarSegments(done.length, summaryTotal.length, skipTotal.length, released.length, WATCHED_COLOR);
  const upcoming = OTHER_DATA.length - released.length;
  document.getElementById("upcomingNote").textContent = upcoming > 0
    ? upcoming + (upcoming > 1 ? " títulos todavía sin estrenar" : " título todavía sin estrenar")
    : "";

  const main = document.getElementById("main");

  if (otherOpen && !UNIVERSE_META[otherOpen]) otherOpen = null;
  let panelHtml = "";
  if (otherOpen) {
    const meta = UNIVERSE_META[otherOpen];
    const st = universeStats(otherOpen);
    panelHtml = '<div class="universe-page' + (universeJustOpened ? " fresh" : "") + '" id="universePanel">' +
      '<div class="universe-head"><h2 class="display-font">' + meta.label + '</h2><span class="phase-count">' + groupCountLabel(st.done, st.total) + "</span></div>" +
      '<div class="phase-bar-outer">' + buildBarSegments(st.done, st.summary, st.skip, st.released, WATCHED_COLOR) + "</div>" +
      '<div class="grid universe-grid">' + st.items.map(buildCardHtml).join("") + "</div>" +
      "</div>";
  }

  main.innerHTML = '<section class="saga"><div class="brand-grid">' + OTHER_UNIVERSES_ORDER.map(function (key) {
    const b = UNIVERSE_BRANDS[key];
    const st = universeStats(key);
    if (!st.total) return "";
    return '<button class="brand-tile' + (otherOpen === key ? " active" : "") + '" style="' + brandStyle(key) + '" onclick="openUniverse(\'' + key + '\')">' +
      '<span class="brand-logo">' + (b ? '<img src="' + b.logo + '" alt="' + b.alt + '" />' : "") + "</span>" +
      '<span class="brand-name">' + (b ? b.short : UNIVERSE_META[key].label) + "</span>" +
      '<span class="brand-count">' + st.done + " de " + st.total + "</span>" +
      '<span class="brand-bar">' + buildBarSegments(st.done, st.summary, st.skip, st.released, WATCHED_COLOR) + "</span>" +
      "</button>";
  }).join("") + "</div>" + panelHtml + "</section>";
}

function brandStyle(universeKey) {
  const meta = UNIVERSE_META[universeKey];
  return "--brand:" + meta.color + ";--brand-glow:" + meta.glow;
}

function render() {
  document.getElementById("resetBtn").style.display = mainView === "podium" ? "none" : "";
  document.getElementById("overallBar").style.display = mainView === "podium" ? "none" : "";
  if (mainView === "other") {
    document.getElementById("gauge").style.display = "none";
    document.getElementById("ucmControls").style.display = "none";
    document.getElementById("podiumControls").style.display = "none";
    renderOtherView();
    return;
  }
  if (mainView === "podium") {
    document.getElementById("gauge").style.display = "none";
    document.getElementById("ucmControls").style.display = "none";
    document.getElementById("podiumControls").style.display = "";
    renderPodiumView();
    return;
  }
  document.getElementById("gauge").style.display = "";
  document.getElementById("ucmControls").style.display = "";
  document.getElementById("podiumControls").style.display = "none";

  const filtered = DATA.filter(function (d) { return matchesFilter(d, filter); });
  const released = filtered.filter(isReleased);
  const done = released.filter(function (d) { return status[d.id] === "watched"; });
  const skipTotal = released.filter(function (d) { return status[d.id] === "skip"; });
  const summaryTotal = released.filter(function (d) { return status[d.id] === "summary"; });

  document.getElementById("count").innerHTML = done.length + '<span> / ' + released.length + " vistas</span>";
  document.getElementById("overallBar").innerHTML = buildBarSegments(done.length, summaryTotal.length, skipTotal.length, released.length, WATCHED_COLOR);
  const upcoming = filtered.length - released.length;
  document.getElementById("upcomingNote").textContent = upcoming > 0
    ? upcoming + (upcoming > 1 ? " títulos todavía sin estrenar" : " título todavía sin estrenar")
    : "";

  function gemSvg(color) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.5"' + SVG_CAP +
      '<path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>';
  }

  const gauge = document.getElementById("gauge");
  gauge.innerHTML = Object.keys(PHASES).map(function (p) {
    const num = Number(p);
    const meta = PHASES[num];
    const stats = phaseStats(status, num);
    const gpct = stats.released ? stats.done / stats.released : 0;
    const cls = stats.complete ? " gem-done" : gpct > 0 ? " gem-partial" : "";
    const iconColor = stats.complete ? "#000" : gpct > 0 ? "#7DD3FC" : "#5A6090";
    return '<div class="gem-wrap" title="' + meta.label + '">' +
      '<div class="gem' + cls + '">' +
      gemSvg(iconColor) +
      '</div><span class="gem-num">' + num + '</span></div>';
  }).join("");

  const main = document.getElementById("main");

  if (sortMode === "chrono") {
    const items = DATA.filter(function (d) { return matchesFilter(d, filter); })
      .slice()
      .sort(function (a, b) { return CHRON_ORDER[a.id] - CHRON_ORDER[b.id]; });
    const cardsHtml = items.map(buildCardHtml).join("");
    main.innerHTML = '<section class="saga"><div class="saga-head"><h2 class="display-font">Orden Cronológico</h2></div>' +
      '<div class="grid">' + cardsHtml + "</div></section>";
    return;
  }

  main.innerHTML = SAGAS.map(function (saga) {
    const sagaHasVisibleItems = saga.phases.some(function (p) {
      return DATA.filter(function (d) { return d.phase === p && matchesFilter(d, filter); }).length > 0;
    });
    if (!sagaHasVisibleItems) return "";

    const complete = sagaComplete(status, saga);
    const phasesHtml = saga.phases.map(function (phaseNum) {
      const meta = PHASES[phaseNum];
      const stats = phaseStats(status, phaseNum);
      const items = DATA.filter(function (d) { return d.phase === phaseNum && matchesFilter(d, filter); });
      if (items.length === 0) return "";
      const collapsed = !!collapsedPhases[phaseNum];
      const cardsHtml = items.map(buildCardHtml).join("");

      return '<div class="phase-block' + (collapsed ? " is-collapsed" : "") + '">' +
        '<div class="phase-head" data-phase="' + phaseNum + '" onclick="togglePhaseCollapse(' + phaseNum + ')" style="cursor:pointer;">' +
        '<span class="phase-chevron' + (collapsed ? " collapsed" : "") + '">' + chevronSvg + "</span>" +
        "<h3>" + meta.label + '</h3><span class="phase-count">' + groupCountLabel(stats.done, stats.total, items) + "</span></div>" +
        '<div class="phase-bar-outer">' + buildBarSegments(stats.done, stats.summary, stats.skip, stats.released, WATCHED_COLOR) + "</div>" +
        '<div class="phase-grid-wrap" data-phase="' + phaseNum + '" style="max-height:' + (collapsed ? "0px" : "none") + '">' +
        '<div class="grid">' + cardsHtml + "</div></div>" +
        "</div>";
    }).join("");

    return '<section class="saga"><div class="saga-head"><h2 class="display-font">' + saga.label + "</h2>" +
      (complete ? '<span class="saga-complete">completa</span>' : "") + "</div>" + phasesHtml + "</section>";
  }).join("");
}

  });
});
document.getElementById("blurEyeBtn").addEventListener("click", function () {
  blurUnwatched = !blurUnwatched;
  updateBlurEyeIcon();
  savePrefs();
  render();
});

document.querySelectorAll("#podiumFilter .mini-toggle").forEach(function (btn) {
  btn.addEventListener("click", function () {
    podiumFilter = btn.dataset.pf;
    podiumEditing = null;
    syncControlButtons();
    savePrefs();
    render();
  });
});

let quizItemId = null;
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizCurrentOptions = [];
let quizCurrentCorrect = 0;

function shuffleOptions(options, correctIdx) {
  const indices = options.map(function (_, i) { return i; });
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }
  const shuffled = indices.map(function (i) { return options[i]; });
  const newCorrect = indices.indexOf(correctIdx);
  return { shuffled: shuffled, correct: newCorrect };
}

function startQuiz(itemId) {
  quizItemId = itemId;
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  document.getElementById("quizBackdrop").classList.add("show");
  renderQuizQuestion();
}

function closeQuiz() {
  quizItemId = null;
  document.getElementById("quizBackdrop").classList.remove("show");
}

function retryQuiz() {
  quizIndex = 0;
  quizScore = 0;
  quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const questions = QUIZZES[quizItemId] || [];
  document.getElementById("quizBarInner").style.width = Math.round((quizIndex / questions.length) * 100) + "%";
  document.getElementById("quizProgress").textContent = "Pregunta " + (quizIndex + 1) + " de " + questions.length;

  const q = questions[quizIndex];
  const result = shuffleOptions(q[1], q[2]);
  quizCurrentOptions = result.shuffled;
  quizCurrentCorrect = result.correct;

  const body = document.getElementById("quizBody");
  body.innerHTML = '<p class="quiz-question">' + escapeHtml(q[0]) + "</p>" +
    quizCurrentOptions.map(function (opt, i) {
      return '<button class="quiz-option" data-i="' + i + '" onclick="selectQuizAnswer(' + i + ')">' + escapeHtml(opt) + "</button>";
    }).join("");
}

function selectQuizAnswer(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const questions = QUIZZES[quizItemId] || [];
  const correct = quizCurrentCorrect;
  if (i === correct) quizScore++;

  const buttons = document.querySelectorAll("#quizBody .quiz-option");
  buttons.forEach(function (btn, idx) {
    if (idx === correct) btn.classList.add("correct");
    else if (idx === i) btn.classList.add("incorrect");
  });

  const isLast = quizIndex === questions.length - 1;
  const nextBtn = document.createElement("button");
  nextBtn.className = "quiz-next";
  nextBtn.textContent = isLast ? "Ver resultado" : "Siguiente";
  nextBtn.onclick = isLast ? showQuizResult : nextQuizQuestion;
  document.getElementById("quizBody").appendChild(nextBtn);
}

function nextQuizQuestion() {
  quizIndex++;
  quizAnswered = false;
  renderQuizQuestion();
}

function showQuizResult() {
  const questions = QUIZZES[quizItemId] || [];
  document.getElementById("quizBarInner").style.width = "100%";
  document.getElementById("quizProgress").textContent = "Resultado";

  let verdict;
  if (quizScore === questions.length) verdict = "Perfecto. No se te escapó nada.";
  else if (quizScore >= 8) verdict = "Prestaste muchísima atención.";
  else if (quizScore >= 6) verdict = "Muy bien, te acordás de lo importante.";
  else if (quizScore >= 4) verdict = "Nada mal, aunque algo se te escapó.";
  else verdict = "Che, capaz conviene volver a verla.";

  document.getElementById("quizBody").innerHTML =
    '<p class="quiz-score">' + quizScore + "/" + questions.length + "</p>" +
    '<p class="quiz-verdict">' + verdict + "</p>" +
    '<div class="quiz-actions"><button id="quizRetryBtn" onclick="retryQuiz()">Reintentar</button>' +
    '<button id="quizCloseBtn" onclick="closeQuiz()">Cerrar</button></div>';
}

document.getElementById("quizLaunchBtn").addEventListener("click", function () {
  if (!statusPickerId) return;
  const id = statusPickerId;
  closeStatusPicker();
  startQuiz(id);
});
document.getElementById("quizClose").addEventListener("click", closeQuiz);
document.getElementById("quizBackdrop").addEventListener("click", function (e) {
  if (e.target.id === "quizBackdrop") closeQuiz();
});

let searchOpen = false;
function normSearch(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
}
function sectionLabelOf(item) {
  if (item.phase && PHASES[item.phase]) return PHASES[item.phase].label;
  if (item.universe && UNIVERSE_META[item.universe]) return UNIVERSE_META[item.universe].label;
  return "";
}
function searchItems(query) {
  const tokens = normSearch(query).split(" ").filter(Boolean);
  if (!tokens.length) return null;
  const tier1 = [], tier2 = [];
  DATA.concat(OTHER_DATA).forEach(function (item) {
    const title = normSearch(item.es + " " + item.en);
    if (tokens.every(function (t) { return title.indexOf(t) !== -1; })) { tier1.push(item); return; }
    const hay = title + " " + normSearch(sectionLabelOf(item) + " " + (item.characters || []).join(" "));
    if (tokens.every(function (t) { return hay.indexOf(t) !== -1; })) tier2.push(item);
  });
  const byDate = function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; };
  return tier1.sort(byDate).concat(tier2.sort(byDate));
}
function buildSearchRow(item) {
  const rel = isReleased(item);
  const st = status[item.id];
  const poster = posters[item.id];
  const blurred = blurUnwatched && !st;
  let meta = item.year + (lengthShort(item) ? " · " + lengthShort(item) : "") + " · " + sectionLabelOf(item);
  if (!rel) {
    meta = "Sale " + formatDate(item.date) + " · " + sectionLabelOf(item);
  } else {
    if (st === "watched") meta += ' · <span style="color:#FFF8E7">✓ Vista</span>';
    else if (st === "summary") meta += ' · <span style="color:#7DD3FC">≡ Solo resumen</span>';
    else if (st === "skip") meta += " · Descartada";
    if (ratings[item.id]) meta += ' · <span style="color:#F3E7C9">★ ' + ratings[item.id] + "</span>";
  }
  const thumb = (rel && poster) ? '<img src="' + poster + '" alt=""' + (blurred ? ' class="blurred"' : "") + " />" : "";
  return '<button class="search-row' + (rel ? '' : ' search-row-locked') + '" onclick="goToItem(\'' + item.id + '\')">' +
    '<div class="search-thumb">' + thumb + "</div>" +
    '<div class="search-info"><p class="search-title">' + escapeHtml(item.es) + '</p><p class="search-meta">' + meta + "</p></div>" +
    "</button>";
}
function renderSearchResults() {
  const box = document.getElementById("searchResults");
  const res = searchItems(document.getElementById("searchInput").value);
  if (res === null) { box.innerHTML = '<p class="search-hint">Escribí un título, un personaje o una sección.</p>'; return; }
  if (res.length === 0) { box.innerHTML = '<p class="search-hint">Sin resultados.</p>'; return; }
  const shown = res.slice(0, 40);
  box.innerHTML = '<p class="search-count">' + res.length + (res.length === 1 ? " resultado" : " resultados") + (res.length > 40 ? " (mostrando 40)" : "") + "</p>" +
    shown.map(buildSearchRow).join("");
}
function refreshSearch() { if (searchOpen) renderSearchResults(); }
function goToItem(id) {
  const item = findItemById(id);
  if (!item) return;
  closeSearch();
  const isOther = !DATA.some(function (d) { return d.id === id; });
  mainView = isOther ? "other" : "ucm";
  if (!isOther) {
    if (!matchesFilter(item, filter)) filter = "all";
    if (collapsedPhases[item.phase]) { collapsedPhases = Object.assign({}, collapsedPhases); collapsedPhases[item.phase] = false; }
  } else {
    otherOpen = item.universe;
  }
  syncControlButtons();
  savePrefs();
  render();
  requestAnimationFrame(function () {
    const el = document.querySelector('.card[data-id="' + id + '"]');
    if (!el) return;
    if (typeof el.scrollIntoView === "function") {
      try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) { el.scrollIntoView(); }
    }
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 2200);
  });
}

function openSearch() {
  searchOpen = true;
  document.getElementById("searchBackdrop").classList.add("show");
  document.body.style.overflow = "hidden";
  renderSearchResults();
  document.getElementById("searchInput").focus();
}
function closeSearch() {
  searchOpen = false;
  document.getElementById("searchBackdrop").classList.remove("show");
  document.body.style.overflow = "";
  document.getElementById("searchInput").blur();
}
document.getElementById("searchBtn").addEventListener("click", openSearch);
document.getElementById("searchCloseBtn").addEventListener("click", closeSearch);
document.getElementById("searchInput").addEventListener("input", renderSearchResults);
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && searchOpen) closeSearch(); });

loadState();
loadPosterCache();
loadPrefs();
loadRatings();
loadTiebreak();
loadWatchDates();
loadLengthCache();
syncControlButtons();
render();

const missingPosters = DATA.concat(OTHER_DATA).filter(function (d) { return isReleased(d) && !posters[d.id]; });
if (missingPosters.length > 0) {
  fetchAllPosters(missingPosters, function (id, url) {
    posters[id] = url || "";
    render();
    refreshSearch();
  }).then(savePosterCache);
}

refreshLengths(function () {
  render();
  refreshSearch();
});
</script>
